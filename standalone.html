<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>后量子算法跟踪台（单文件版） · NICCS 第一轮候选</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161d2c; --panel2:#1b2436; --line:#26304a;
    --fg:#e8ecf6; --dim:#93a0bb; --acc:#5b8dff; --sig:#4472C4; --kem:#92D050;
    --warn:#ffb347; --ok:#4fd18b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:"Noto Sans CJK SC","Noto Sans CJK JP","PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#121a29,#0f1420);
         border-bottom:1px solid var(--line);padding:14px 20px 10px}
  h1{margin:0 0 4px;font-size:19px;letter-spacing:.3px}
  .sub{color:var(--dim);font-size:12.5px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
  input[type=search]{background:var(--panel);border:1px solid var(--line);color:var(--fg);
        padding:7px 11px;border-radius:8px;font-size:13px;min-width:230px;outline:none}
  input[type=search]:focus{border-color:var(--acc)}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:999px;
        padding:5px 12px;font-size:12.5px;cursor:pointer;user-select:none}
  .chip:hover{border-color:var(--acc);color:var(--fg)}
  .chip.on{background:#1d2a4a;border-color:var(--acc);color:#cfe0ff}
  main{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:0;height:calc(100vh - 108px)}
  .tablewrap{overflow:auto;padding:12px 8px 40px 16px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:7px 9px;border-bottom:1px solid #1e2740;text-align:left;white-space:nowrap}
  th{position:sticky;top:0;background:#141b2a;color:var(--dim);font-weight:600;cursor:pointer;font-size:12px}
  th:hover{color:var(--fg)}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#182137}
  tbody tr.sel{background:#1d2a4a}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;border:1px solid}
  .pill.sig{color:#9dbcf5;border-color:#33507f}
  .pill.kem{color:#b9e58c;border-color:#4a6b2c}
  .pill.kex{color:#f0c98a;border-color:#7a5c2a}
  .fam{color:var(--dim);font-size:12px}
  .na{color:#4c5872}
  .miss{color:var(--warn);font-size:11px}
  aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px 18px 50px}
  aside h2{margin:2px 0 2px;font-size:16px}
  aside .meta{color:var(--dim);font-size:12px;margin-bottom:12px}
  .kv{margin:10px 0;font-size:13px;line-height:1.65}
  .kv b{color:#b9c6e4;font-weight:600}
  .sz{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
  .sz div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .sz span{display:block;color:var(--dim);font-size:11.5px}
  .sz strong{font-size:16px;font-variant-numeric:tabular-nums}
  .pts{margin:8px 0 0;padding-left:18px;font-size:12.5px;line-height:1.6;color:#cdd6ea}
  .note{background:#141c2e;border:1px solid var(--line);border-left:3px solid var(--acc);
        border-radius:6px;padding:8px 10px;font-size:12px;color:#a9b6d3;margin-top:10px;word-break:break-word}
  .track{background:#131a29;border:1px dashed #2c3a58;border-radius:8px;
         padding:9px 11px;font-size:12px;color:var(--dim);margin-top:12px}
  footer{position:fixed;bottom:0;left:0;right:0;background:#0c111b;border-top:1px solid var(--line);
         color:#6d7a96;font-size:11.5px;padding:5px 16px;display:flex;justify-content:space-between}
  @media(max-width:900px){main{display:block;height:auto}.tablewrap{max-height:46vh}aside{border-left:none;border-top:1px solid var(--line);max-height:none}}
  .hint{font-size:12px;color:#8b98b8;margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .hint b{color:var(--fg)}
  .fambar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:8px;border:1px solid var(--line)}
  .fambar span{display:block;min-width:2px}
  .legend{font-size:11.5px;color:#8b98b8;margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .btn{cursor:pointer;background:#1b2740;border:1px solid var(--line);color:var(--fg);border-radius:6px;
       padding:4px 10px;font-size:12px;user-select:none}
  .btn:hover{border-color:var(--acc)}
  @media print{
    header .bar,.hint,.fambar,.legend,footer,aside{display:none!important}
    body{background:#fff;color:#000}
    main{display:block;height:auto}
    .tablewrap{max-height:none;overflow:visible}
    table,th,td{color:#000;border-color:#bbb}
  }
</style>
</head>
<body>
<header>
  <h1>后量子算法跟踪台 <span class="sub">· NICCS 公钥算法第一轮候选</span></h1>
  <div class="sub" id="sub">加载中…</div>
  <div class="bar">
    <input type="search" id="q" placeholder="搜索算法名 / 家族 / 假设关键词…" />
    <span class="chip on" data-f="cat" data-v="">全部类别</span>
    <span class="chip" data-f="cat" data-v="sig">签名</span>
    <span class="chip" data-f="cat" data-v="kem">KEM</span>
    <span class="chip" data-f="cat" data-v="kex">KEX</span>
    <span style="width:12px"></span>
    <span class="chip" data-f="fam" data-v="格密码">格密码</span>
    <span class="chip" data-f="fam" data-v="编码类">编码类</span>
    <span class="chip" data-f="fam" data-v="哈希类">哈希类</span>
    <span class="chip" data-f="fam" data-v="MPC-in-the-Head">MPC-in-the-Head</span>
    <span class="chip" data-f="fam" data-v="多变量">多变量</span>
    <span class="chip" data-f="fam" data-v="同源类">同源类</span>
    <span class="chip" data-f="fam" data-v="其他">其他</span>
    <span style="width:12px"></span>
    <span class="chip" id="paramsOnly">仅看有参数</span>
  </div>
  <div class="hint">
    <span id="cnt">显示 …</span>
    <span>·　数据来源：官方公开名单 + 提交方公开规范；摘录与分类供内部参考，以原始材料为准</span>
    <span>·　按 <b>/</b> 聚焦搜索，<b>Esc</b> 清空；点行看详情</span>
    <span></span>
    <span style="color:#6d7a96">数据版本 <b id="ver">—</b></span>
  </div>
  <div class="fambar" id="famBar"></div>
  <div class="legend" id="famLegend"></div>
</header>

<main>
  <div class="tablewrap">
    <table id="tbl">
      <thead><tr>
        <th data-k="name">算法</th>
        <th data-k="cat">类别</th>
        <th data-k="family">家族</th>
        <th data-k="pk" class="num">公钥 (B)</th>
        <th data-k="sk" class="num">私钥 (B)</th>
        <th data-k="sig" class="num">签名 (B)</th>
        <th data-k="ct" class="num">密文 (B)</th>
        <th data-k="sum" class="num">合计 (B)</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <aside id="detail"><h2>选择一个算法</h2><div class="meta">点左侧表格任意一行，这里会显示它的家族、假设、摘要与 128 位参数。</div></aside>
</main>

<footer>
  <span id="f1"></span>
  <span>数据来源：官方公开材料整理 · 本页仅含公开算法信息，不含任何个人信息</span>
</footer>

<script>
let DATA=null, view=[], sel=null, sortK="name", sortAsc=true;
const filter={cat:"", fam:""};
let paramsOnly=false;

const $=s=>document.querySelector(s);
function famOf(a){
  if(a.cls) return a.cls;
  const f=(a.family||"")+" "+(a.assumption||"");
  if(/格|LWE|SIS|NTRU|LWR|LIP|学习误差|模块|环-/.test(f)) return "格密码";
  if(/编码|码|McEliece|综合征|Goppa|秩度量/.test(f)) return "编码类";
  if(/MPC-?in-?the-?Head|MPCitH|TCitH|VOLE|in-the-head/i.test(f)) return "MPC-in-the-Head";
  if(/哈希|Merkle|超树|无状态|SPHINCS/i.test(f)) return "哈希类";
  if(/多变量|UOV|Oil|Vinegar|MQ/.test(f)) return "多变量";
  if(/同源|超奇异|isogen/i.test(f)) return "同源类";
  return "其他";
}
function nums(a){
  const L=a.level1||{};
  const pk=L.pk??null, sk=L.sk??null, sig=L.sig??null, ct=L.ct??null;
  const sum=(pk||0)+((sig||ct)||0);
  return {pk,sk,sig,ct,sum: (pk||sig||ct)?sum:null};
}
function fmt(v){ return (v===null||v===undefined)?'<span class="na">—</span>':v.toLocaleString(); }

function render(){
  const q=$("#q").value.trim().toLowerCase();
  view=DATA.algorithms.filter(a=>{
    if(filter.cat && a.cat!==filter.cat) return false;
    if(filter.fam && famOf(a)!==filter.fam) return false;
    const n=nums(a);
    if(paramsOnly && n.sum===null) return false;
    if(q){
      const hay=(a.name+" "+(a.family||"")+" "+(a.assumption||"")+" "+(a.summary||"")).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const dir=sortAsc?1:-1;
  view.sort((x,y)=>{
    const nx=nums(x), ny=nums(y);
    let vx,vy;
    if(["pk","sk","sig","ct","sum"].includes(sortK)){ vx=nx[sortK]; vy=ny[sortK];
      if(vx===null)vx=dir>0?Infinity:-Infinity; if(vy===null)vy=dir>0?Infinity:-Infinity; }
    else { vx=(sortK==="family"?famOf(x):x[sortK])||""; vy=(sortK==="family"?famOf(y):y[sortK])||""; }
    if(typeof vx==="string") return vx.localeCompare(vy,"zh")*dir;
    return (vx-vy)*dir;
  });
  const tb=$("#tbl tbody"); tb.innerHTML="";
  for(const a of view){
    const n=nums(a);
    const tr=document.createElement("tr");
    if(sel&&sel.id===a.id) tr.className="sel";
    tr.innerHTML=`<td>${a.name.length>34?a.name.slice(0,33)+"…":a.name}
        </td>
      <td><span class="pill ${a.cat}">${a.catLabel.replace("密钥封装（KEM）","KEM").replace("密钥交换（KEX）","KEX").replace("数字签名","签名")}</span></td>
      <td class="fam">${famOf(a)}</td>
      <td class="num">${fmt(n.pk)}</td><td class="num">${fmt(n.sk)}</td>
      <td class="num">${fmt(n.sig)}</td><td class="num">${fmt(n.ct)}</td>
      <td class="num">${fmt(n.sum)}</td>`;
    tr.onclick=()=>{ const same=sel&&sel.id===a.id; sel=a; render(); detail();
      if(!same && window.innerWidth<=900){ const d=document.getElementById("detail"); d.scrollIntoView({behavior:"smooth",block:"start"}); } };
    tb.appendChild(tr);
  }
  $("#f1").textContent=`显示 ${view.length} / ${DATA.algorithms.length} 个候选 · 生成于 ${DATA.generated}`;
  const famDist=(DATA.family_order||[]).map(k=>`${k} ${(DATA.counts&&DATA.counts.by_family&&DATA.counts.by_family[k])||0}`).join(" · ");
  $("#sub").textContent=`${DATA.source}　|　共 ${DATA.algorithms.length} 个候选　|　有 128 位参数 ${DATA.algorithms.filter(a=>nums(a).sum!==null).length} 个`+(famDist?`　|　家族分布：${famDist}`:"");
  const _v=document.getElementById("ver"); if(_v) _v.textContent=DATA.generated||"—";
  const _c=document.getElementById("cnt");
  if(_c) _c.textContent=`显示 ${view.length} / ${DATA.algorithms.length} 条`;
  buildFamBar();
}

function detail(){
  const a=sel; if(!a) return;
  const n=nums(a), L=a.level1||{};
  const src=(L.source||"").replace(/^/,"");
  $("#detail").innerHTML=`
    <h2>${a.name}</h2>
    <div class="meta">${a.catLabel} · ${famOf(a)} · 状态：${a.status||"—"}</div>
    <div class="sz">
      <div><span>公钥</span><strong>${n.pk!==null?n.pk.toLocaleString():"—"}</strong></div>
      <div><span>${a.cat==="sig"?"签名":"密文"}</span><strong>${(a.cat==="sig"?n.sig:n.ct)!==null?(a.cat==="sig"?n.sig:n.ct).toLocaleString():"—"}</strong></div>
      <div><span>私钥</span><strong>${n.sk!==null?n.sk.toLocaleString():"—"}</strong></div>
      <div><span>合计（公钥+${a.cat==="sig"?"签名":"密文"}）</span><strong>${n.sum!==null?n.sum.toLocaleString():"—"}</strong></div>
    </div>
    <div class="kv"><b>128 位参数集：</b>${L.label||"—"}</div>
    <div class="kv"><b>家族：</b>${a.family||"—"}</div>
    <div class="kv"><b>安全假设：</b>${a.assumption||"—"}</div>
    ${a.summary?`<div class="kv"><b>摘要：</b>${a.summary}</div>`:""}
    ${a.points&&a.points.length?`<div class="kv"><b>关键点：</b></div><ul class="pts">${a.points.map(p=>`<li>${p}</li>`).join("")}</ul>`:""}
    ${src?`<div class="note">参数来源：${src}</div>`:""}
    <div class="track">长期跟踪：首次收录 ${a.first_seen||"—"}　·　最近核查 —　·　变更记录 0 条<br>
      （后续版本、安全性估计、攻击进展、实现结果都会记在这里）</div>
    <div class="kv" style="color:#6d7a96;font-size:11.5px">规范文本：${a.spec_file||"—"}${a.spec_chars?"（"+a.spec_chars+" 字符）":""}</div>
    <div style="margin-top:10px"><span class="btn" id="copyBtn" onclick="copyDetail()">复制摘要</span>
      <span class="btn" onclick="window.print()">打印本页</span></div>`;
}

const FAMCOL={"格密码":"#4472c4","编码类":"#92d050","哈希类":"#ffc000","MPC-in-the-Head":"#a35bd6",
              "多变量":"#e06666","同源类":"#00b0a0","其他":"#8a8f98"};
function buildFamBar(){
  const el=document.getElementById("famBar");
  if(!el||el.dataset.done||!DATA.counts||!DATA.counts.by_family) return;
  const bf=DATA.counts.by_family;
  el.innerHTML=Object.entries(bf).map(([k,v])=>`<span style="flex:${v};background:${FAMCOL[k]||"#666"}" title="${k}：${v}"></span>`).join("");
  const lg=document.getElementById("famLegend");
  if(lg) lg.innerHTML=Object.entries(bf).map(([k,v])=>`<span><i style="background:${FAMCOL[k]||"#666"}"></i>${k} ${v}</span>`).join("");
  el.dataset.done="1";
}
function copyDetail(){
  const a=sel; if(!a) return;
  const L=a.level1||{};
  const z=v=>(v===null||v===undefined)?"—":v;
  const t=[`${a.name}（${a.catLabel} / ${famOf(a)}）`,
    `家族：${a.family||"—"}`,
    `安全假设：${a.assumption||"—"}`,
    a.summary?`摘要：${a.summary}`:"",
    (a.points&&a.points.length)?`关键点：\n- ${a.points.join("\n- ")}`:"",
    `128 位参数集：${L.label||"—"}`,
    `尺寸（B）：公钥 ${z(a.level1&&a.level1.pk)} / ${a.cat==="sig"?"签名":"密文"} ${z(a.cat==="sig"?(a.level1&&a.level1.sig):(a.level1&&a.level1.ct))} / 私钥 ${z(a.level1&&a.level1.sk)}`,
    `来源：官方公开名单与提交方公开规范（仅供内部参考）`
  ].filter(Boolean).join("\n");
  const done=()=>{const b=document.getElementById("copyBtn"); if(b){b.textContent="已复制 ✓"; setTimeout(()=>b.textContent="复制摘要",1200);} };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done,c=>{prompt("复制以下内容：",t);}); }
  else prompt("复制以下内容：",t);
}
document.addEventListener("keydown",e=>{
  const q=document.getElementById("q");
  if(e.key==="/"&&document.activeElement!==q){e.preventDefault();q.focus();}
  if(e.key==="Escape"&&document.activeElement===q){q.value="";q.dispatchEvent(new Event("input"));}
});

document.querySelectorAll(".chip[data-f]").forEach(c=>c.onclick=()=>{
  const f=c.dataset.f, v=c.dataset.v;
  if(f==="cat"){
    filter.cat=v;
    document.querySelectorAll('.chip[data-f="cat"]').forEach(x=>x.classList.toggle("on",x===c));
  } else {
    filter.fam=(filter.fam===v)?"":v;
    document.querySelectorAll('.chip[data-f="fam"]').forEach(x=>x.classList.toggle("on",x.dataset.v===filter.fam));
  }
  render();
});
$("#paramsOnly").onclick=e=>{ paramsOnly=!paramsOnly; e.target.classList.toggle("on",paramsOnly); render(); };
$("#q").oninput=render;
document.querySelectorAll("th").forEach(th=>th.onclick=()=>{
  const k=th.dataset.k; if(!k) return;
  if(sortK===k) sortAsc=!sortAsc; else { sortK=k; sortAsc=(k==="name"||k==="cat"||k==="family"); }
  render();
});

拒绝采样环节进行专项优化，在保留双模态结构（y + (−1)^b v）低拒绝率优势的同时，以三角分布（Triangular）替换离散高斯分布，彻底消除浮点运算和高斯采样，从而实现简单的常数时间实现。理论上，BiT 证明对三角掩码分布而言，梯形（Trapezoidal）目标分布最大化掩码效果，且在双模态框架内该三角→梯形构造比标准高斯→高斯方案提供更强的掩码保护。方案在 FSwA 框架下基于 MSIS 和 MLWE 假设，提供 6 个参数集（80/128/192/256/384/512 位安全级别），覆盖更广泛的应用场景。规范还附带 NTRU 版本描述，但指出其在尺寸和性能上不优于 MLWE 版本。文件同时包含对比 Dilithium 的效率数据、参数表及安全分析。","points":["双模态三角掩码分布（y + (−1)^b v, y 服从三角分布），配合梯形目标分布，优于高斯→高斯方案；","无浮点运算、无高斯采样，支持常数时间实现，抗侧信道；","6 个安全参数集：80/128/192/256/384/512 位；","NTRU 变体（MSIS/NTRU 假设）仅作描述，尺寸性能不优于 MLWE 版本；","采用分区（Partitioned）拒绝采样和公钥/签名压缩技术。"],"level1":{"label":"BiT-Classical-129","pk":1048,"sk":null,"sig":1504,"ct":null,"source":"Classical 129-bit (quantum 118-bit) security; Table 3 lists 6 parameter sets by Classical bits (101,129,192,256,392,512); pk and sig sizes given but no sk column; uses bimodal triangular rejection sampling over MLWE+MSIS | 128 位参数摘录自规范（Table 1 (line ~396-397): 128-bit security pk=1048, sig=1504）"},"spec_file":"sig_02_BIT_Bimodal_Triangular_distribution_based_lattice_signatures.txt","spec_chars":42130,"text_available":true,"id":"sig-bit-bimodal-triangular-distr","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"CEDRUS+C","catLabel":"数字签名","cat":"sig","family":"哈希-无状态签名（Stateless Hash-Based Signature），SPHINCS+ 框架变体","assumption":"哈希函数的单向性和碰撞抵抗性，不依赖数论或格问题，量子安全由哈希函数的量子抗性保证。","summary":"CEDRUS+C 是在 SPHINCS+（SLH-DSA）框架基础上改进而来的无状态哈希签名方案。其签名结构分三层：底层使用改进的一次签名（OTS）方案 WOTSC；中间层通过 XMSS（eXtended Merkle Signature Scheme）超树（Hypertree）结构链接多棵 Merkle 树，支持多次签名；上层引入改进的少次签名（Few-time Signature，FTS）方案 FORS+C 取代 SPHINCS+ 中的 FORS，用于对哈希消息进行少次签名并提供额外的量子安全边际。规范还提出了 CEDRUS+C 中 OTS 的非齐次（Inhomogeneous）变体 WOTSC，对链长进行差异化配置以改善安全-尺寸权衡。安全性在哈希函数模型下归约到 WOTSC 的 EUF-CMA 安全性，不依赖任何代数困难假设，为纯哈希的候选方案，与 SLH-DSA 形成直接竞争和补充。","points":["SPHINCS+ 框架改进：FORS+C（改进 FTS）+ XMSS Hypertree + WOTSC（改进 OTS）三层结构；","安全性仅依赖哈希函数单向性/碰撞抵抗，不需格或数论假设；","非齐次 WOTSC OTS 优化链长分配，改进安全-尺寸权衡；","与 SPHINCS+/SLH-DSA 直接竞争，声称在性能或尺寸上有改进（文件未提供具体参数数值）；","提供安全归约、具体安全分析及实现基准。"],"level1":{"pk":40,"sk":80,"sig":9460,"label":"CEDRUS+C-160s","source":"128 位参数摘录自规范（Table 1.1 (line ~1429): CEDRUS+C-160s Classical=160bit (Category I), SK=80, PK=40, Sig=9460）"},"spec_file":"sig_03_CEDRUS_C.txt","spec_chars":3162,"text_available":false,"id":"sig-cedrus-c","status":"第一轮候选","first_seen":"2026-09-20","cls":"哈希类"},{"name":"CEDRUSɑ","catLabel":"数字签名","cat":"sig","family":"哈希-无状态签名（Stateless Hash-Based Signature），SPHINCS+ 框架变体","assumption":"哈希函数的单向性和碰撞抵抗性，安全性不依赖代数困难假设。","summary":"CEDRUSα 是与 CEDRUS+C 并列提交的另一哈希签名变体，采用不同的改进策略。在 OTS 层，CEDRUSα 使用 WOTSα（而非 WOTSC），引入新的 α 参数化 Winternitz 链结构；在少次签名层，使用 FORC（而非 FORS+C），对 SPHINCS+ 中 FORS 的密钥与树生成方式进行改动。规范延续 CEDRUS+C 的三层超树架构（FORC + XMSS Hypertree + WOTSα），并同样提供非齐次 WOTSα 变体（Inhomogeneous WOTSα）。两种 CEDRUS 变体代表同一改进框架的两条实例化路径，分别针对不同的性能-安全权衡点。与 CEDRUS+C 相同，安全性在哈希函数模型下形式化证明，包含安全归约、具体安全分析以及实现基准测试。参数集与实例化见第 1.11 节（文件正文提及但未在节选范围内详细展开）。","points":["与 CEDRUS+C 并列的 SPHINCS+ 改进变体，核心区别在 OTS（WOTSα）和 FTS（FORC）组件；","安全性仅依赖哈希函数，不需代数困难假设；","非齐次 WOTSα：α 参数化链长分配，不同位置链长可差异化；","FORC 为 FORS 的改进版少次签名，与 CEDRUS+C 的 FORS+C 构成不同的改进路径；","提供安全归约、具体安全分析及实现基准（文件未在节选范围内提供具体参数数值）。"],"level1":{"pk":40,"sk":80,"sig":9460,"label":"CEDRUS+C-160s","source":"128 位参数摘录自规范（Table 1.1 (line ~1429): CEDRUS+C-160s Classical=160bit (Category I), SK=80, PK=40, Sig=9460）"},"spec_file":"sig_03_CEDRUS_C.txt","spec_chars":3162,"text_available":false,"id":"sig-cedrus","status":"第一轮候选","first_seen":"2026-09-20","cls":"哈希类"},{"name":"Chinith","catLabel":"数字签名","cat":"sig","family":"哈希-VOLE-in-the-head（MPC-in-the-head，基于 VOLE 承诺的零知识证明）","assumption":"底层分组密码（SM4、uBlock、Vistrutah）的单向性（OWF 安全性），以及随机预言机/理想密码假设。","summary":"Chinith 是一个基于 VOLE-in-the-head（ViTH）技术的后量子签名方案族，包含三个具体方案：SM4th（底层 OWF 为 SM4 分组密码）、uBlockith（底层为 uBlock 分组密码）和 Vistrutith（底层为 Vistrutah 分组密码）。签名构造分两大步骤：(1) 从 VOLE 承诺生成 VOLE 相关性：利用批量\"除一（All-but-One）\"向量承诺和种子展开，将承诺转换为向量不经意线性评估（VOLE）相关性；(2) 零知识证明阶段：基于 VOLE 承诺对相应 OWF（分组密码计算过程中的密钥扩展和加密约束）进行零知识证明，证明签名者知道满足公钥约束的私钥前像。三个方案分别针对不同性能需求，SM4th 面向国产密码生态，uBlockith 和 Vistrutith 提供替代选项。规范包含 VOLE-in-the-head 构造细节、针对 SM4、uBlock、Ballet、Vistrutah 分组密码的线性约束推导，以及安全性声明和分析。","points":["三方案：SM4th（基于 SM4）、uBlockith（基于 uBlock）、Vistrutith（基于 Vistrutah），同族 ViTH 框架；","安全仅依赖 OWF（分组密码单向性）和随机预言机，不需格/代数假设；","VOLE-in-the-head：批量 ABO 向量承诺 + 种子展开 + VOLE 相关性 + ZK 证明；","类比 FAEST（AES-based ViTH 签名），但面向国产/多样化 OWF；","对 SM4 密钥扩展和加密约束进行精细线性化处理，并通过见证扩展（Witness Extension）技术优化证明大小。"],"level1":{"pk":32,"sk":32,"sig":3818,"label":"SM4th-EM-d2-128s-lo","source":"128 位参数摘录自规范（Table 16 (line 6946): SM4th-EM-d2-128s-lo sk=32, pk=32, signature=3818 bytes (smallest 128-bit variant)）"},"spec_file":"sig_05_Chinith.txt","spec_chars":72214,"text_available":true,"id":"sig-chinith","status":"第一轮候选","first_seen":"2026-09-20","cls":"MPC-in-the-Head"},{"name":"COMPASS-SIG","catLabel":"数字签名","cat":"sig","family":"模块格-LWE（Module-LWE），Fiat-Shamir with Abort 范式，新引入 Shell-MISIS（Shell-CVP）假设","assumption":"MLWE + Shell-MISIS（Shell-CVP）——签名向量同时满足足够大的欧几里得范数和足够小的无穷范数，位于高维球壳区域，传统 L₂-短向量求解不能直接导致伪造。即使不依赖 Shell-MISIS，仅凭 MISIS 在所提安全级别下也满足要求。","summary":"COMPASS-SIG 是量子安全套件的组成部分，基于模格困难问题（MLWE + MSIS/MISIS），采用 FSwA 范式，以 ML-DSA（Dilithium）为主要比较基准并进行系统性改进。核心创新：(1) 移除 ML-DSA 中的提示（hint）向量——提示既造成签名膨胀（约 5%），又使 MISIS 范数界加倍，COMPASS-SIG 以稍大公钥为代价彻底删除提示，使签名尺寸显著缩小；(2) 针对 MSIS/MISIS 建立更紧致的签名伪造安全估计，利用 Shell-CVP 假设同时约束 L₂ 和 L∞ 范数，使得直接 L₂ 短向量求解不足以伪造签名；(3) 确定性拒绝采样，可在常数时间内执行，免受侧信道攻击；(4) 支持 128/256/384/512 位经典安全（对应 80/128/192/256 位量子安全），pk+2·sig 在几乎所有实用场景下小于 ML-DSA；(5) 基于 NTT 域实现，环 R_q = Z_q[X]/(X^n+1)。","points":["移除 hint 向量（ML-DSA 有 hint），签名尺寸远小于 ML-DSA，公钥略大于 ML-DSA；","新安全假设 Shell-MISIS（Shell-CVP）：签名向量在 L₂–L∞ 球壳内，增强签名伪造安全性；","均匀误差 LWE 配合确定性拒绝采样，常数时间实现，抗侧信道；","支持 4 个安全档：128/256/384/512 位经典安全（80/128/192/256 位量子安全）；","提供 x86 参考实现与 AVX2 优化实现及性能结果；pk+2·sig 总通信代价优于 ML-DSA。"],"level1":{"label":"COMPASS-SIG-128","pk":1664,"sk":960,"sig":2080,"ct":null,"source":"128-bit classical security; all three byte sizes from Table 2 | 128 位参数摘录自规范（Table 2 (line 760): COMPASS-SIG-128 Public key=1664, Private key=960, Signature=2080）"},"spec_file":"sig_06_COMPASS-SIG.txt","spec_chars":22366,"text_available":true,"id":"sig-compass-sig","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"CS","catLabel":"数字签名","cat":"sig","family":"模块格-LWE/SIS（带中止的 Fiat-Shamir，含 rANS 压缩编码）","assumption":"Module-LWE 和 Module-SIS 困难问题","summary":"CS 是基于模块格的数字签名方案，采用 Fiat-Shamir with Aborts 范式，整体结构与 Dilithium/ML-DSA 相近。方案工作在多项式商环 Rq = Zq[x]/(x^n+1) 上，使用 NTT 加速多项式乘法；挑战多项式由哈希函数生成固定权重稀疏多项式；签名过程中使用高低比特分解与提示向量技术（与 Dilithium 一致）并通过拒绝采样防止密钥泄露。核心创新在于引入 rANS（Range Asymmetric Numeral Systems）编码对签名进行熵编码压缩，在不改变安全基础的前提下缩减签名传输尺寸。规范分\"简化 CS\"和\"完整 CS\"两个版本，分别对应不同参数配置；第 2.7 节定义了专用的 Reject 算法，第 3.1 节给出拒绝采样详细分析，并提供正确性证明与签名重复次数上界。安全章节在标准/量子随机预言模型下给出 EUF-CMA 归约，并分析实际安全强度与其他安全特性。","points":["工作环 Rq = Zq[x]/(x^n+1)，使用 NTT 域表示与加速","引入 rANS 熵编码压缩签名，是相对 Dilithium 最主要的新增设计","高低比特 + 提示向量（PowerRound / Hint）设计与 Dilithium 一致","包含简化版与完整版两套签名流程，含专用 Reject 算法","参数集详情（文件仅含目录与章节框架，详细参数表未在提取内容中显示）"],"level1":{"label":"CS-128","pk":976,"sk":1888,"sig":1548,"ct":null,"source":"规范 Table 1 直接摘录（pk 976 / sig 1548 / sk 1888 bytes） | 128 位参数摘录自规范（Table 1 (line ~187): CS-128 public key=976, signature=1548, secret key=1888）"},"spec_file":"sig_07_CS.txt","spec_chars":2152,"text_available":false,"id":"sig-cs","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"DARTS","catLabel":"数字签名","cat":"sig","family":"模块格-LWE/SIS（带双模态拒绝采样的 Fiat-Shamir）","assumption":"Module-LWE 和 Module-SIS 困难问题","summary":"DARTS 是基于 Fiat-Shamir with Aborts 范式的模块格数字签名方案，主要创新在于将双模态拒绝采样（bimodal rejection sampling）引入模块格签名框架，从而提高效率。方案在多项式商环 Rq = Zq[x]/(x^n+1) 上工作，秘密向量采用三元分布 Tp（系数以概率 p 取 ±1、以概率 1-2p 取 0）采样；公钥矩阵 A ∈ Rq^{k×(l-1)} 由种子通过拒绝采样展开。签名阶段引入\"Rejection on Secret\"步骤，在密钥生成时对秘密 s 预作拒绝以降低后续签名的整体拒绝概率。多项式乘法采用不完整 NTT（log₂n - 2 层）结合 Karatsuba 算法：在每个分量环 Rq[x]/(X⁴ - ζ^{2i+1}) 内用 Karatsuba 将模乘数从 16 次降至 9 次，全部多项式总模乘次数减少约 7n/4。挑战哈希 H₂ 生成恰好 τ 个非零系数的稀疏多项式。规范提供 UF-CMA 安全归约与强不可伪造性（sUF-CMA）扩展证明，并附参考实现、AVX2 优化实现和 NEON 优化实现三套代码。","points":["安全归约到 Module-LWE 和 Module-SIS，支持 UF-CMA 和 sUF-CMA","双模态拒绝采样（bimodal rejection sampling），提升签名效率","三元分布 Tp 秘密 + 密钥生成时\"Rejection on Secret\"，降低签名阶段拒绝率","不完整 NTT（log₂n - 2 层）+ Karatsuba，减少约 7n/4 次模乘","提供参考、AVX2、NEON 三套实现；具体参数集（文件提取内容约 211 行，详细参数表未完整显示）"],"level1":{"label":"DARTS-128","pk":1120,"sk":1536,"sig":1449,"ct":null,"source":"n=512, k=1, l=2, q=130817; all three byte sizes from Table 2 in spec; MNLWE is a module-NLWE variant providing stronger key-recovery security than standard MLWE | 128 位参数摘录自规范（Table 2 (lines 718-721): 128 bits — Public key size=1120, Secret key size=1536, Signature size=1449）"},"spec_file":"sig_08_DARTS.txt","spec_chars":49772,"text_available":true,"id":"sig-darts","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"DOVE","catLabel":"数字签名","cat":"sig","family":"多变量-UOV 派生（Double Vinegar-by-Vinegar 框架）","assumption":"DOVE-MQ 问题（求解 DOVE 多变量二次方程组）和 DOVE-UOV 问题（恢复 DOVE 陷门）困难","summary":"DOVE 是以 Oil-and-Vinegar 为基础、引入\"双重醋变量\"（Double Vinegar-by-Vinegar，VbV）框架的多变量签名方案。标准 UOV 通过单层醋-油分解提供签名陷门，但全局油空间的代数痕迹易被 Kipnis-Shamir、Reconciliation、Intersection、MinRank、楔形等攻击利用。DOVE 在此基础上引入第二层醋变量对 DOVE 映射进行扩展，增加了公钥的代数复杂性，旨在在抵御上述攻击的同时进一步缩减密钥尺寸和提升效率，设计目标之一是\"超越 UOV 并拯救 MAYO\"（Efficiency Evolution: Outperforming UOV and Rescuing MAYO）。方案提供两个变体：Classic 版本采用标准完整公钥；pkc-skc 版本通过公私钥分离压缩降低带宽。安全性形式归约到新定义的 DOVE-MQ 和 DOVE-UOV 两个困难问题，并分析了楔形攻击、对称代数攻击、截断环攻击等已知攻击路径。","points":["Double Vinegar-by-Vinegar（VbV）框架，对标准 UOV 引入第二层醋变量","两个变体：Classic（完整公钥）和 pkc-skc（公私钥分离压缩）","安全归约到 DOVE-MQ（方程组求解）与 DOVE-UOV（陷门恢复）两个新困难问题","分析了 Kipnis-Shamir、Reconciliation、Intersection、Rectangular MinRank、楔形/对称代数/截断环等攻击","具体参数集及公钥/签名尺寸（文件提取内容仅为目录，详细数据未显示）"],"level1":{"pk":43576,"sk":24,"sig":136,"label":"DOVE_pkc_skc_128","source":"128 位参数摘录自规范（Table 2 (line 498): DOVE_pkc_skc_128 Public key=43576, Private key=24, Signature=136）"},"spec_file":"sig_09_DOVE.txt","spec_chars":2468,"text_available":false,"id":"sig-dove","status":"第一轮候选","first_seen":"2026-09-20","cls":"多变量"},{"name":"Facto-DSA","catLabel":"数字签名","cat":"sig","family":"多变量-因式分解类（Factorization-based，立方中心映射）","assumption":"在有限域 Fq[t] 中对特定立方多项式映射求逆（因式分解 + 三角二次映射求逆）的困难性（Facto-DSA 困难问题）","summary":"Facto-DSA 是基于多项式因式分解的多变量数字签名算法。公钥为 m 个关于 r = 2n 个变量的齐次三次方程组；中心映射为 (X, Y) ↦ (Q(X) + R(Y))·Y，其中乘法为有限域 Fq[t] 中的多项式乘法，Q 为齐次三角二次映射（Fnq → Fnq），R 为随机二次映射。方案采用同构隐藏（IP2）范式：秘密输入映射 (X, Y) = (L₁z, L₂z) 及秘密满秩输出映射 U 对中心映射进行混淆，发布公开立方映射 P = T∘F∘S。域参数 q = 65519 ≡ 3 (mod 4) 使签名所需的平方根计算可通过求幂完成。早期基于二次因式分解的方案已被外代数 + MinRank 攻击破解；Facto-DSA 改用立方构造并引入额外二次部分 R(Y)，专门对抗这类结构性攻击。规范提供失败概率分析（含对安全性的影响）、与已有因式分解方案的详细对比，以及经典/量子攻击复杂度汇总表。安全模型为随机预言模型下的 EUF-CMA。","points":["公钥为 m 个齐次三次方程（r = 2n 变量），中心映射在 Fq[t] 中做多项式乘法","域参数 q = 65519 ≡ 3 (mod 4)，三角映射 Q 和随机映射 R 联合构成中心陷门","立方构造 (Q(X)+R(Y))·Y 针对外代数/MinRank 结构攻击进行加固","IP2 范式（同构隐藏），秘密含线性映射 L₁, L₂ 和满秩输出映射 U","每密钥至少支持 2⁶⁴ 次不同消息签名；具体密钥/签名尺寸（文件截断处标注有参数表，详细数值不可见）"],"level1":{"pk":40040,"sk":3094,"sig":40,"label":"Facto-DSA-128","source":"128 位参数摘录自规范（Table 2 (lines 797-799): Facto-DSA-128 public key bytes=40040, secret key bytes=3094, signature bytes=40）"},"spec_file":"sig_10_Facto-DSA.txt","spec_chars":34384,"text_available":true,"id":"sig-facto-dsa","status":"第一轮候选","first_seen":"2026-09-20","cls":"多变量"},{"name":"FlexTree","catLabel":"数字签名","cat":"sig","family":"哈希-超树（SPHINCS+ 改进，含非齐次 WOTSC 一次性签名 + PORS+FP 少时签名）","assumption":"哈希函数单向性与抗碰撞性（保守假设，与 SLH-DSA 相同级别）","summary":"FlexTree 是基于哈希函数的无状态数字签名方案，在 SPHINCS+/SLH-DSA 超树框架基础上进行系统性改进，并直接与 NIST 标准 SLH-DSA 进行对比评估。方案包含三个主要构件：一是非齐次 WOTSC 一次性签名（Inhomogeneous WOTSC OTS），在哈希链参数设计上相比 WOTS+ 更加灵活；二是 PORS+FP 少时签名，在 FORS 子树结构基础上引入\"有限认证节点\"（FP）约束减少签名中包含的路径节点数量；三是 FlexTree 超树，将上述组件组织为灵活参数超树层级结构（Hypertree）。规范提供完整的地址编码方案（Address Scheme）、成员函数定义、详细算法规范（密钥生成/签名/验证/XMSS 层），以及在标准模型下的安全规约（第 3.1 节）和与 SLH-DSA 的具体性能对比（第 4.3 节）。设计目标是通过改进底层原语在保持哈希基础安全假设的同时缩减签名尺寸并改善效率。","points":["基于 SPHINCS+/SLH-DSA 超树框架，规范中直接与 SLH-DSA 对比","一次性签名：非齐次 WOTSC（Inhomogeneous WOTSC OTS）","少时签名：PORS+FP（FORS + 有限认证节点约束），减少签名路径开销","安全规约：随机预言模型下 EUF-CMA，第 3.1 节给出形式证明","具体参数集及签名尺寸（文件仅含目录，详细数值未在提取内容中显示）"],"level1":{"pk":40,"sk":80,"sig":9580,"label":"FlexTree-160s","source":"128 位参数摘录自规范（Table 4.1 (line 2594): FlexTree-160s PK Size=40, SK Size=80, Signature Size=9580 (Category I = 128-bit classical securit）"},"spec_file":"sig_11_FlexTree.txt","spec_chars":3751,"text_available":false,"id":"sig-flextree","status":"第一轮候选","first_seen":"2026-09-20","cls":"哈希类"},{"name":"Galas Signature Scheme","catLabel":"数字签名","cat":"sig","family":"哈希-VOLE-in-the-Head（基于 Gala 单向函数，对称原语类）","assumption":"Gala 单向函数的单向性 + VOLEitH/QuickSilver 证明系统的可靠性（无结构化代数假设）","summary":"Galas 是基于 VOLE-in-the-Head（VOLEitH）框架的数字签名方案，核心在于专门设计的单向函数 Gala。Gala 采用\"宽-窄\"反转结构（wide-then-narrow inversion-based OWF）：每次宽反转后引入子域压缩，使证明见证长度缩短为 λ/2，大幅减少 QuickSilver 证明代价。证明系统基于 degree-3 多项式约束（DOVE 映射在子域中表示为三次约束），通过 VOLEitH 框架中的 GGM 树批量全部减一向量承诺（BAVC）提交 VOLE 相关数据，经 Fiat-Shamir 变换得到非交互签名。整体框架与 FAEST 最接近（转录结构和序列化风格相同），Galas 的特有贡献是 Gala OWF 及其度-3 QuickSilver 约束系统。安全声明为 EUF-CMA（量子随机预言模型），条件为：(1) Gala 关系单对不可伪造；(2) VOLEitH/BAVC/QuickSilver 对度-3 约束可靠；(3) NGCC pseudoXOF/pseudohash 按领域分离的随机预言建模。每个公钥最多支持 2^80 次消息签名，niv 固定 160 位。","points":["核心 OWF：Gala（宽-窄反转结构），degree-3 QuickSilver 约束系统","子域压缩：每个宽反转的证明见证长度压缩至 λ/2","证明框架：VOLEitH + BAVC（GGM 树）+ QuickSilver，与 FAEST 框架最接近","安全目标：EUF-CMA（QROM）；每公钥最多 2^80 次消息","niv = 160 位（所有参数集统一）；具体密钥/签名尺寸（\"Claimed NGCC security\" 表格在提取内容截断处，数值不可见）"],"level1":{"pk":40,"sk":20,"sig":4812,"label":"Galas-160S","source":"128 位参数摘录自规范（Table 9 (line 1891): Galas-160S lambda=160, pk/sk=40/20, |sigma|=4812 (128(80)-bit security)）"},"spec_file":"sig_12_Galas_Signature_Scheme.txt","spec_chars":42951,"text_available":true,"id":"sig-galas-signature-scheme","status":"第一轮候选","first_seen":"2026-09-20","cls":"MPC-in-the-Head"},{"name":"GreatWall Signature Algorithm","catLabel":"数字签名","cat":"sig","family":"哈希-VOLE-in-the-Head（基于 Pylon 单向函数，对称原语类）","assumption":"Pylon 单向函数的单向性 + VOLEitH 证明系统的可靠性（无格/编码/多变量代数假设）","summary":"GreatWall 是完全基于单向函数假设的后量子签名族，使用 VOLE-in-the-Head（VOLEitH）框架，并专门设计了对称原语 Pylon 作为基础 OWF。Pylon 定义在二进制扩展域上，核心设计特征是嵌套前馈结构：一条外层前馈覆盖整个函数，将秘密输入绑定到全局输入输出关系；两条内层前馈在外层内部作用于局部子结构。该嵌套布局以极低额外乘法代价丰富每轮代数复杂性，同时保持较少的非线性约束数量（对 VOLEitH 证明效率至关重要）。签名本质上是对 Pylon 预像知识的非交互零知识证明：利用 GGM 树 BAVC 承诺 VOLE 相关数据，经随机预言导出挑战，通过 QuickSilver 风格乘法一致性检验证明 Pylon 关系，最终由 Fiat-Shamir 变换非交互化。安全性完全归约到 Pylon 单向性和 VOLEitH 可靠性，不引入任何结构化代数困难假设。方案提供四个变体：GreatWall-128/192/256/512，统一架构下仅调整参数，覆盖不同安全级别。","points":["核心 OWF：Pylon（二进制扩展域，嵌套前馈结构，非线性约束数量极小）","证明框架：VOLEitH + GGM-BAVC + QuickSilver，不引入任何结构化代数假设","四个安全级别变体：GreatWall-128/192/256/512，统一架构","线性部分由 VOLE 相关性局部处理，签名代价主要来自非线性部分","具体参数（密钥/签名尺寸）（文件内容在关键 Pylon 描述处截断，详细参数表未显示）"],"level1":{"label":"GreatWall-128S","source":"规范 Table 10（优化实现：GreatWall-128S 公钥 36 B、签名 2758 B；S 为短签名变体；未给出 sk）","pk":36,"sk":null,"sig":2758,"ct":null},"spec_file":"sig_13_GreatWall_Signature_Algorithm.txt","spec_chars":37965,"text_available":true,"id":"sig-greatwall-signature-algorith","status":"第一轮候选","first_seen":"2026-09-20","cls":"MPC-in-the-Head"},{"name":"Lynxer","catLabel":"数字签名","cat":"sig","family":"哈希-VOLE-in-the-Head（基于 Lynx 单向函数，对称原语类）","assumption":"Lynx 单向函数的单向性 + VOLEitH 证明系统的可靠性","summary":"Lynxer 是基于 VOLE-in-the-Head（VOLEitH）框架的对称原语类后量子签名方案，核心构件为专门设计的对 VOLEitH 友好的单向函数 Lynx。Lynx 定义在二进制扩展域上，其非线性分量（Sbox）和线性层均针对 QuickSilver 证明代价联合最小化设计，具体选择涵盖域的选择、结构选择、非线性分量及线性层配置。签名由非交互零知识证明构成：通过批量全部减一向量承诺（BAVC）承诺 VOLE 相关数据，利用 QuickSilver 证明 Lynx OWF 关系一致性，经 Fiat-Shamir 变换非交互化。此外，Lynxer 独立设计了 TCCR（Tweakable Collision-Resistant）哈希函数用于超树节点计算。规范对 BAVC 进行了精细的叶节点交织（leaf interleaving）、最小覆盖开放（minimum-span opening）等优化，并提供详细的 VOLE 承诺/重建/修正/种子转换子协议。参数选择章节给出经典/量子安全级别对应分析与失败概率分析，并与 FAEST 等方案进行性能对比。","points":["核心 OWF：Lynx（二进制扩展域，非线性与线性层协同设计以最小化 QuickSilver 代价）","独立设计 TCCR 哈希函数，用于 Lynxer 超树节点计算","BAVC 支持叶节点交织与最小覆盖开放优化，减少承诺开销","与 GreatWall/Galas 同为 VOLEitH + BAVC + QuickSilver 技术路线","具体参数集（密钥/签名尺寸）（文件提取内容于第 8 章安全分析前截断，详细数值未显示）"],"level1":{"pk":40,"sk":40,"sig":4607,"label":"Lynxer-160s","source":"128 位参数摘录自规范（Table (line 3320): Lynxer-160s pk=40, sk=40, sig=4607 (128-bit classical / 80-bit quantum per lines 3167-3168)）"},"spec_file":"sig_14_Lynxer.txt","spec_chars":65612,"text_available":true,"id":"sig-lynxer","status":"第一轮候选","first_seen":"2026-09-20","cls":"MPC-in-the-Head"},{"name":"MORNING-ATLAS","catLabel":"数字签名","cat":"sig","family":"模块格（Module-LWR，Module Learning with Rounding）＋ Fiat-Shamir","assumption":"（文件未提供/不明确）","summary":"提取文件（sig_15_MORNING-ATLAS.txt，共 49 行）仅包含提交者信息页（submitter form），无任何算法规范正文。文件可见内容仅为提交日期（2026 年 4-6 月）、联系页码等行政信息，不含算法家族、安全假设、构造原理、参数集或性能等任何技术内容。无法对该方案作出任何技术性评估。","points":["文件内容仅为提交者信息页，无算法规范正文（文件未提供）","算法家族（文件未提供）","安全假设与困难问题（文件未提供）","参数集、公钥/私钥/签名尺寸（文件未提供）","与已知方案的关系（文件未提供）"],"level1":{"pk":1328,"sk":2128,"sig":2081,"label":"ATLAS-128","source":"规范参数表（ATLAS-128：公钥 1328 / 私钥 2128 / 签名 2081 字节）"},"spec_file":"sig_15_MORNING-ATLAS.txt","spec_chars":382,"text_available":false,"id":"sig-morning-atlas","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"Octarine","catLabel":"数字签名","cat":"sig","family":"根式环-LWR（Radical Ring Learning-With-Rounding，带中止的 Fiat-Shamir）","assumption":"根式环舍入学习（RR-LWR）困难问题（Ring-LWR 的特例）","summary":"ARCANE-Octarine（简称 Octarine）是 ARCANE 密码套件中的数字签名方案，安全性基于新引入的根式环舍入学习（RR-LWR）问题。方案工作在根式扩张环 Sq,n,k = (Zq[y]/(y^n+1))[x]/(x^k-y-2) 上，该环与 Zq[x]/((x^k-2)^n+1) 同构，本质是 Ring-LWR 实例。模量 q 选为 2 的幂（签名取 q=2^24），无需拒绝采样即可生成均匀随机系数，大幅简化实现并降低掩码防护难度。签名参数 n=1024，k=1/2/5，覆盖三个安全级别。与 Dilithium2 相比，Octarine-128 平均签名迭代仅 2.13 次（Dilithium2 为 4.25 次），标准差 1.55（对比 3.72），签名时间方差显著更低。密钥生成时预计算确定性误差 s₂ = As₁ - ⌊p/q·As₁⌋（LWR 舍入误差），签名阶段不再重复计算。根式环结构使公开矩阵相比 Module-LWR（ML-DSA）大幅缩小——与 ML-DSA-87 比，矩阵紧凑存储从 >41.2 kB 降至约 6.1 kB（约 1/7）。所有采样分布为区间 [-α, α-1] 上的均匀分布（默认 α=2），支持高效的边界检查（仅需检测进位）。","points":["安全基础：RR-LWR（根式环舍入学习），是 Ring-LWR 的特例，亦是 Module-LWR 替代方案","工作环：Sq,n,k（根式扩张环），q 为 2 的幂（签名 q=2^24）","签名参数：n=1024，k=1/2/5，覆盖 Octarine-128/192/256 三个安全级别","签名平均迭代 2.13 次（Octarine-128），方差极低（SD=1.55）；公开矩阵约为 ML-DSA-87 的 1/7","带中止的 Fiat-Shamir；采样无需拒绝采样，利于侧信道防护（掩码实现）"],"level1":{"label":"Octarine-128","pk":1344,"sk":2432,"sig":2564,"ct":null,"source":"n=1024, k=1, q=2^24; all three byte sizes from Table 2; RR-LWR = Ring-Ring LWR (Rounded Random LWR); Fiat-Shamir with Aborts paradigm over ring-LWR | 128 位参数摘录自规范（Table 1 (line 461-463): Octarine-128 sk=2432, pk=1344, sig=2564 bytes）"},"spec_file":"sig_16_Octarine.txt","spec_chars":28053,"text_available":true,"id":"sig-octarine","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"OPS Digital Signature Algorithm","catLabel":"数字签名","cat":"sig","family":"模块格-LWE/SIS（Dilithium 变体，对称模块设置）","assumption":"Module-LWE 和 Module-SIS 困难问题","summary":"OPS-SIG 是基于 MLWE 和 MSIS 困难问题的模块格数字签名方案，遵循 Dilithium（ML-DSA）风格的\"带中止的 Fiat-Shamir\"结构，引入对称模块设置（k=ℓ）以缩减密钥与签名尺寸。方案采用非标准模量 q = 2^26 - 2^12 + 1 = 67104769，环维度 n=512（Level-1/3）或 n=1024（Level-5）。签名三元组 σ=(c̃, z, h)：c̃ 为 2λ 位挑战种子，z 为响应多项式，h 为稀疏提示向量（最多 ω 个非零项）。参考实现使用 SM3 为基础的哈希/XOF 进行测试。三个参数集分别针对不同安全等级：Level-1（128位经典/80位量子），Level-3（256位/128位），Level-5（512位/256位）；密钥和签名尺寸为（公钥, 私钥, 签名）= (2560, 3840, 4349)/(3392, 5056, 5540)/(6720, 9920, 12021) 字节；期望签名迭代次数约 1.12/1.93/2.02。规范在随机预言模型（ROM）和量子随机预言模型（QROM）下均给出形式安全证明，并在第 6 节报告渐进与实测性能。","points":["模量 q = 67104769（2^26 - 2^12 + 1），n = 512（L1/L3）或 1024（L5）","三个安全级别：Level-1（128/80 位），Level-3（256/128 位），Level-5（512/256 位，经典/量子）","密钥/签名尺寸（字节）：(2560, 3840, 4349) / (3392, 5056, 5540) / (6720, 9920, 12021)","参考实现哈希采用 SM3；期望签名迭代分别约 1.12 / 1.93 / 2.02 次","ROM 和 QROM 下均有安全归约证明；支持 255 字节上下文字符串"],"level1":{"label":"OPS-Level-1","pk":2560,"sk":3840,"sig":4349,"ct":null,"source":"Level-1 targets 128-bit classical / 80-bit quantum security; n=512, q=67104769, k=l=3; all three byte sizes from Table 1 | 128 位参数摘录自规范（Table 1 (line 92): Level-1 (128/80) (pk, sk, sig) = (2560, 3840, 4349)）"},"spec_file":"sig_17_OPS_Digital_Signature_Algorithm.txt","spec_chars":32395,"text_available":true,"id":"sig-ops-digital-signature-algori","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"Origami","catLabel":"数字签名","cat":"sig","family":"多变量-UOV/局部分区（Local Zoned Oil-and-Vinegar）","assumption":"隐藏结构不可区分性（Hidden-Structure Indistinguishability） + 多目标 MQ 求逆困难性","summary":"Origami 是从 Oil-and-Vinegar 范式出发、针对全局代数攻击进行系统性改进的多变量签名方案。标准 UOV 的全局油空间可被楔形攻击（wedge attack）、极形式外代数关系、低秩/MinRank 类方法恢复，Origami 的应对策略是将签名陷门分布到多个局部区域（local zones）：每个区域有独立的隐藏局部表示和线性求解步骤——签名者固定醋变量与私有采样的部分油坐标后，对从消息和随机盐派生的目标区域解局部线性系统。受控的跨区域项在保持签名者视角线性化的同时，使公钥映射不呈现任何全局可利用的代数对象。公钥以标准显式完整 MQ 映射形式发布（无结构痕迹），签名和私钥紧凑，但公钥尺寸和生成成本是主要瓶颈。规范包括完整序列化规则、形式安全证明（归约到隐藏结构不可区分性与多目标 MQ 求逆）、参数族建议，以及参考、优化和 AVX2 三套实现测试结果。","points":["核心创新：局部区域（local zones）分区，打散全局油空间以抵御楔形/外代数/MinRank 等攻击","签名流程：每区域独立线性求解，跨区域项受控，兼顾签名效率与安全性","公钥：显式完整 MQ 映射（无内部结构），是签名大小与生成成本的主要瓶颈","安全归约：隐藏结构不可区分性 + 多目标 MQ 求逆困难性","提供参考/优化/AVX2 三套实现；具体参数集及公钥/私钥/签名尺寸（文件内容在第 1.3 节描述处截断，详细参数表未完整显示）"],"level1":{"pk":2996,"sk":16,"sig":116,"label":"Origami-128","source":"128 位参数摘录自规范（Table 4 (line 1577): Origami-128 sk=16B, pk=2.996KB, sig=116B; Table 5 (line 1625): sig=116B, pk+sig=3112B）"},"spec_file":"sig_18_Origami.txt","spec_chars":47978,"text_available":true,"id":"sig-origami","status":"第一轮候选","first_seen":"2026-09-20","cls":"多变量"},{"name":"Phoenix","catLabel":"数字签名","cat":"sig","family":"哈希-超树（SPHINCS+ 改进，含 GWOTS+C 一次性签名和 TFORS 少时签名）","assumption":"哈希函数单向性与抗碰撞性（保守假设，无数论/格结构假设）","summary":"Phoenix 是无状态哈希基数字签名方案，在 SPHINCS+ 框架上引入两个新原语以减小签名尺寸。一次性签名采用 GWOTS+C（广义 WOTS+C）：以校验和偏移量窗口 [L, U] 替换单一固定校验和目标，签名者仅认证偏移量 C-L，在保留省略部分哈希链效率优势的同时大幅降低固定点设计的拒绝成本，有效插值于 WOTS+ 与固定点 WOTS+C 之间。少时签名采用 TFORS（Transposed FORS）：将 FORS 秘密值集合在 Merkle 树间转置组织，改变认证路径重叠位置，使 Octopus 剪枝和强制剪枝更有效，将结构重叠直接转化为签名压缩。两组件集成至超树（Hypertree）框架，提供 size-oriented（后缀\"s\"）和 speed-oriented（后缀\"f\"）两类参数族，每密钥支持最多 2^64 次签名。签名大小对比 SPHINCS+：128 位安全降低约 20%（Phoenix-SHAKE-128s 为 6,252 字节 vs. 7,856 字节）；192 位降低约 13–18%；256 位降低约 5–11%。","points":["GWOTS+C：校验和偏移量窗口 [L, U]，降低固定点方案拒绝成本，介于 WOTS+ 与 WOTS+C 之间","TFORS：转置 FORS，改善 Octopus 剪枝效率，将结构重叠转化为签名压缩","签名大小对比 SPHINCS+：128 位 -20%（6,252 vs. 7,856 字节），192 位 -13~18%，256 位 -5~11%","无状态超树框架，每密钥最多 2^64 签名，安全级别 128/192/256 位","两类参数族：size-oriented（\"s\"）和 speed-oriented（\"f\"），含 SHA2 和 SHAKE 实例化"],"level1":{"pk":32,"sk":64,"sig":6258,"label":"Phoenix-SM3-128s","source":"128 位参数摘录自规范（Table 4 (line 1844): Phoenix-S ,"first_seen":"2026-09-20","cls":"格密码"},{"name":"Sigurd","catLabel":"数字签名","cat":"sig","family":"编码-正则综合征解码（Regular Syndrome Decoding, RSD，F₂ 上）","assumption":"F₂ 上正则综合征解码（RSD）问题的困难性","summary":"Sigurd 是 RSD 问题上的后量子签名方案，其最大技术特点是彻底移除了传统 VOLEitH 构造（如 FAEST）所需的 GGM 树和 SoftSpokenOT 两层结构，改用基于 Reed-Solomon 关系检验直接生成 VOLE 相关性，大幅减少伪随机数生成器及哈希函数的调用次数，从而提升吞吐量。具体设计分为两层：第一层为基于子域 VOLE 编译到向量承诺的编译器，结合线性关系证明支持；第二层为 RSD 证明系统，通过塔域构造（Tower Field）将 F₂ 上的 RSD 实例提升到扩域，再组合规律性证明协议（Regularity Proof）与 Σ 协议为 He=y 完成全证明，最后经 Fiat-Shamir 变换得到签名。三个参数集（NGCC-128/256/512），优化实现下签名耗时约 1.8 ms / 10.7 ms / 79.9 ms，以较大签名尺寸为代价换取高吞吐量。","points":["三个参数集（NGCC-128/256/512）；签名耗时 1.8 / 10.7 / 79.9 ms","GGM-tree-free：直接基于 Reed-Solomon 生成 VOLE 相关性，减少哈希调用","两级构造：子域-VOLE→向量承诺编译器 + RSD 证明系统","使用塔域（Tower Field）构造将 F₂-RSD 提升至扩域处理；提供规律性证明协议","较大签名尺寸为主要权衡点；与 FAEST 架构形成对比"],"level1":{"pk":112,"sk":80,"sig":25108,"label":"NGCC-128","source":"128 位参数摘录自规范（Table 2 (line ~1486-1488): NGCC-128 pk=112B, sk=80B, sig≈25108B (sample encoded signature length)）"},"spec_file":"sig_24_Sigurd.txt","spec_chars":47771,"text_available":true,"id":"sig-sigurd","status":"第一轮候选","first_seen":"2026-09-20","cls":"编码类"},{"name":"SQIsign2D2","catLabel":"数字签名","cat":"sig","family":"同源-超奇异椭圆曲线（SQIsign 2D 家族，基于二维同源）","assumption":"超奇异椭圆曲线间的同源路径问题（isogeny path problem）及自同态环计算问题，两者在多项式时间意义下等价","summary":"SQIsign2D2 是 SQIsign2D 家族中迄今最高效的变体。核心创新在于引入新型素数形式 p = f·2ᵃ·3ᵇ − 1（满足 2ᵃ ≈ 3ᵇ ≈ √p），使方案同时可利用高效可计算的 3ᵇ-同源，大幅降低二维同源计算的度数需求，从而减少高维同源运算代价。方案还提出两个新算法：ImRanIso（利用 2ᵃ·3ᵇ-同源从 E₀ 生成非光滑同源）和 GenImRanIso（利用可访问的 3ᵇ-同源降低二维同源度数要求），基于此将密钥生成和辅助同源生成阶段的高维同源计算量分别降至 SQIsign2D-East 的 1/4 和 1/3。在 NIST Level 1 安全目标下，相比 SQIsign2D-East，非压缩签名模式下密钥生成加速 2.63×、签名加速 2.15×；压缩签名模式下分别加速 2.75× 和 1.77×。128 位安全级下公钥 64 字节，签名约 150 字节，为 SQIsign 家族中最紧凑方案之一。使用 theta 坐标实现 (2,2)-同源链，并优化了有限域算术。","points":["新素数形式 p = f·2ᵃ·3ᵇ − 1，同时利用 2-幂次和 3-幂次同源","密钥生成/辅助同源计算量分别为 SQIsign2D-East 的 1/4 和 1/3","128-bit：公钥 64 B，签名约 150 B；为 SQIsign 家族当前最快","使用 theta 坐标计算 (2,2)-同源链；Julia 语言实现","同族对比（大小/速度）：SQIsign < SQIsignHD ≈ SQIsign2D2 < SQIsign2D-East < SQIsign2D-West（签名大小）"],"level1":{"pk":64,"sig":154,"label":"SQIsign2D2 (128-bit)","source":"128 位参数摘录自规范（Table 1.1 (line ~217-229): SQIsign2D^2 128-bit secure: public key=64B, compressed signature=154B）"},"spec_file":"sig_25_SQIsign2D2.txt","spec_chars":41006,"text_available":true,"id":"sig-sqisign2d2","status":"第一轮候选","first_seen":"2026-09-20","cls":"同源类"},{"name":"SQIsign2D-push1/2","catLabel":"数字签名","cat":"sig","family":"同源-超奇异椭圆曲线（SQIsign2D-push 变体）","assumption":"超奇异椭圆曲线间的同源路径问题（isogeny path problem）/ 自同态环计算问题","summary":"SQIsign2d-push1/2 在 SQIsign2d-push 框架基础上构建，名称中的\"1/2\"反映其签名阶段 (2,2)-同源链长度约为前代方案的一半，在所有 SQIsign2D 变体中 (2,2)-同源评估的计算代价最低。方案同样以 Σ 协议（证明知道椭圆曲线自同态环）为基础，经 Fiat-Shamir 变换得到签名；采用素数形式 p = c·2^{e₁}·3^{e₂} − 1，在签名阶段复用 3^{e₂}-同源结构降低高维同源的度数需求。安全归约框架沿用 FSwA/FSwH，证明特殊可靠性（Special Soundness）和提示辅助的弱诚实验证者零知识性（hint-assist wHVZK⊥）。方案保留了前代 SQIsign2d-push 的极紧凑签名尺寸，同时在签名计算效率上实现了显著提升。","points":["(2,2)-同源链长度约为 SQIsign2d-push 的 1/2，为 SQIsign2D 家族签名阶段最低同源计算量","素数形式 p = c·2^{e₁}·3^{e₂} − 1，支持高效 3-幂次同源降度数","安全性采用 hint-assist wHVZK⊥ 框架（弱诚实验证者零知识）","签名尺寸极紧凑（沿 SQIsign2D 家族约 66 B pubkey + ~151 B sig 量级）","使用 theta 坐标实现 (2,2)-同源链；Deuring 对应关系转换理想与同源"],"level1":{"pk":64,"sk":518,"sig":150,"label":"Level-1","source":"128 位参数摘录自规范（Table 1 (line 3443-3444): Level-1 Public key=64B, Secret key=518B, Signature=150B）"},"spec_file":"sig_26_SQIsign2D-push1_2.txt","spec_chars":45750,"text_available":true,"id":"sig-sqisign2d-push1-2","status":"第一轮候选","first_seen":"2026-09-20","cls":"同源类"},{"name":"SQIsignTriangle","catLabel":"数字签名","cat":"sig","family":"同源-超奇异椭圆曲线（SQIsign 变体，三角形 Σ 协议）","assumption":"超奇异椭圆曲线自同态环计算的困难性（endomorphism ring problem）","summary":"SQIsignTriangle 是 SQIsign 的变体，采用\"三角形\"结构 Σ 协议：密钥对对应秘密同源 φ_sk: E₀→E_pk；签名时生成承诺同源 φ_com: E₀→E_com；回应阶段计算满足 deg(φ_rsp) = q ≡ c₂ (mod c₁) 的响应同源 φ_rsp: E_pk→E_com，三条同源构成一个\"三角形\"回路（E₀→E_pk→E_com）。Σ 协议经 Fiat-Shamir 变换得到不可伪造签名；使用 Qlapoti 算法将 O₀-理想转化为同源；密钥和签名尺寸直接继承自 SQIsign 参数族。安全性证明覆盖特殊可靠性、提示辅助弱诚实验证者零知识（hint-assisted wHVZK）及 EUF-CMA。在 Intel Core i7-13700（2.10 GHz）上提供三个安全级别的优化 C 实现基准（10^6 CPU 周期单位）。","points":["三角形 Σ 协议：三条同源（φ_sk, φ_com, φ_rsp）构成闭合图","继承 SQIsign 参数集；三个安全级别","使用 Qlapoti 算法（O₀-ideal 转同源）和 Deuring 对应关系","安全证明：特殊可靠性 + 提示辅助 wHVZK + EUF-CMA","优化 C 实现在 Intel Core i7-13700 上测试；公钥/签名大小见规范 Table 1/9"],"level1":{"pk":65,"sig":204,"label":"SQIsignTriangle-128","source":"128 位参数摘录自规范（Table 1 (line 219-222): lambda=128, Public-key size=65B, Signature size=204B）"},"spec_file":"sig_27_SQIsignTriangle.txt","spec_chars":41975,"text_available":true,"id":"sig-sqisigntriangle","status":"第一轮候选","first_seen":"2026-09-20","cls":"同源类"},{"name":"SYDO","catLabel":"数字签名","cat":"sig","family":"编码类（综合征译码 SD ＋ VOLE-in-the-Head）","assumption":"（文件未提供/不明确）","summary":"规范文件仅包含标题行，无任何技术正文内容，无法提取算法设计、安全假设、参数或性能信息。所有技术项均不可用。","points":["文件以提交者信息为主，算法规范正文未包含在提取范围内","算法家族、安全假设、参数、实现细节均（文件未提供/不明确）"],"level1":{"pk":174,"sk":80,"sig":5428,"label":"SYDO-160s","source":"128 位参数摘录自规范（Table 5.4 (line 2147-2150): SYDO-160s pk=174B, sk=80B, sig=5428B (160-bit OWF = 128-bit classical, 80-bit quantum)）"},"spec_file":"sig_28_SYDO.txt","spec_chars":20,"text_available":false,"id":"sig-sydo","status":"第一轮候选","first_seen":"2026-09-20","cls":"编码类"},{"name":"Tins","catLabel":"数字签名","cat":"sig","family":"MPC-in-the-Head（TCitH，门限计算-in-the-head）/ 新型双线性碰撞困难问题","assumption":"归一化子域双线性碰撞（Normalized Subfield Bilinear Collision, NSBC）问题的困难性","summary":"Tins 是基于 NSBC 新困难问题的后量子签名方案，采用 TCitH（Threshold Computation-in-the-Head）框架。NSBC 问题（2024 年由 Huth-Joux 提出）定义为：给定扩域 F_{q^k}^n 中线性无关向量 û、v̂，在子域 F_q 上找到 α、β 使特定双线性等式成立。TCitH 框架在 NSBC 上构建零知识证明，配合批量全减一向量承诺（BAVC）和多项式承诺，最后经 Fiat-Shamir 变换得到签名。相比 Huth-Joux 的 MPCitH 版本具有更小签名尺寸，相比其 VOLEitH 版本具有更简洁直观的签名流程。方案维护 BAVC（batched all-but-one vector commitment）作为核心工具，利用种子树和路径开放实现高效验证。参数集对应不同安全级别，规范提供参数集、KAT 测试向量及已知攻击分析。","points":["使用 NSBC（Normalized Subfield Bilinear Collision）新困难问题（F_q 子域与 F_{q^k} 扩域上的双线性关系）","TCitH（门限计算-in-the-head）框架，非 MPCitH/VOLEitH","BAVC（批量全减一向量承诺）为核心工具；多项式承诺辅助","签名小于同问题 MPCitH 方案；流程比 VOLEitH 版本简洁","提供 KAT 测试向量；参数集、安全证明与已知攻击分析均包含于规范"],"level1":{"pk":51,"sk":32,"sig":3284,"label":"Tins-128","source":"128 位参数摘录自规范（Table 5 (line 1179-1181): Tins-128 sk=32B, pk=51B, sig=3284B）"},"spec_file":"sig_29_Tins.txt","spec_chars":46726,"text_available":true,"id":"sig-tins","status":"第一轮候选","first_seen":"2026-09-20","cls":"MPC-in-the-Head"},{"name":"TRINE","catLabel":"数字签名","cat":"sig","family":"张量同构/三线性形等价（Trilinear Form Equivalence, TFE）","assumption":"三线性形等价（Trilinear Form Equivalence, TFE）问题的困难性，与矩阵码等价（MCE）及张量同构（TI）多项式等价","summary":"TRINE 基于三线性形等价（TFE）困难问题，采用 GMW 范式设计零知识识别协议，再经 Fiat-Shamir 变换转化为签名。核心技术创新在于：放弃传统 GMW 风格的\"可逆线性变换作为回应\"（如 MEDS、ALTEQ），改用\"余秩一不变量\"（corank-one invariant）视角——证明者开放一个有效的余秩一点，验证者重计算对应的典范形式，将每个非基础挑战的回应开销从 O(n² log q) 比特降至 O(n log q) 比特，实现显著的签名压缩。TFE 与矩阵码等价（MCE，即 MEDS 的基础）、交替三线性形等价（ATFE，即 ALTEQ 的基础）、线性码等价（即 LESS 的基础）均在张量同构框架下多项式等价或时间归约，使 TRINE 的安全基础与该族方案高度相关。参数设计考虑了 NQT24 余秩一不变量攻击、Couvreur-Levrat 基于 hull 的矩阵码攻击（CL25）及 Ran-Samardjiska 稀有三角代数攻击（RS24）。","points":["TFE 困难问题，与 MCE（MEDS）、ATFE（ALTEQ）、线性码等价（LESS）多项式等价","余秩一不变量响应：每次非基础挑战回应从 O(n² log q) 降至 O(n log q) 比特","使用不平衡挑战空间（Unbalanced Challenge Space）设计","参数考虑三类最新攻击：NQT24、CL25（hull-based MCE）、RS24（rare-triangle）","量子安全证据：有限域上一般线性群的隐子群方法存在本质瓶颈"],"level1":{"pk":16004,"sk":32,"sig":3124,"label":"Balanced-TRINE-128","source":"128 位参数摘录自规范（Table 1 (line 655-658): Balanced-TRINE-128 sk=32B, pk=16004B, sig=3124B）"},"spec_file":"sig_30_TRINE.txt","spec_chars":46605,"text_available":true,"id":"sig-trine","status":"第一轮候选","first_seen":"2026-09-20","cls":"其他"},{"name":"TSUOV","catLabel":"数字签名","cat":"sig","family":"多变量-UOV/Oil-Vinegar（张量化统一框架，涵盖 QR-UOV、MAYO、SNOVA）","assumption":"多变量二次（MQ）问题和 MinRank 问题的困难性","summary":"TSUOV（Tensor UOV）是对 QR-UOV、MAYO、SNOVA 三种 UOV 变体的统一张量积泛化，揭示三者共同的核心原理：均通过张量类构造扩展油空间维度——无论是通过迹映射（QR-UOV）、块嵌入（MAYO 的扩展映射 P*）还是矩阵环结构（SNOVA 的非交换系数环）。TSUOV 在统一框架下通过 Kronecker 积参数（n, o, m₁, m₂, q, ℓ, k）将上述方法纳入一体，安全性不弱于三个子方案，同时显著减小公钥尺寸（与现有 UOV 变体相比），保持有竞争力的签名大小和计算效率。方案同时提供参考实现和性能优化实现，安全分析覆盖伪造攻击和油醋问题（Oil and Vinegar problem）的专项攻击，并指出参数灵活性为方案的设计优势。与 NIST 额外签名标准化进程中 QR-UOV、MAYO、SNOVA 同为三轮候选方案。","points":["张量积统一框架：同时泛化 QR-UOV（迹映射）、MAYO（扩展映射 P*）、SNOVA（矩阵环）","公钥尺寸明显小于现有 UOV 变体，签名尺寸有竞争力","参数集含 n, o, m₁, m₂, q, ℓ, k；安全性不弱于三子方案","安全假设：MQ 问题（NP-完全）+ MinRank 问题","已知攻击分析：伪造攻击 + Oil-Vinegar 结构攻击；参考实现与优化实现均已提供"],"level1":{"pk":778,"sk":32,"sig":896,"label":"TSUOV-128","source":"128 位参数摘录自规范（Table 1 (line 1157-1168): TSUOV-128 secret key=32B, public key=778B, signature=896B）"},"spec_file":"sig_31_TSUOV.txt","spec_chars":36642,"text_available":true,"id":"sig-tsuov","status":"第一轮候选","first_seen":"2026-09-20","cls":"多变量"},{"name":"UVW signature","catLabel":"数字签名","cat":"sig","family":"编码-广义码（基于 Wave 范式演进的 UVW 陷门签名）","assumption":"UVW 陷门码的解码困难性（与 Wave 方案所用广义 (U,U+V) 构造相关）","summary":"UVW 签名方案（中文规范）是一种基于编码理论的后量子签名方案，以 Wave 方案为原型进行扩展演进。Wave 方案基于广义 (U,U+V) 型码的解码困难性；UVW 方案在此基础上引入三分量 UVW 陷门结构，通过对码字分布的精细分析同时保持签名的均匀输出特性。核心设计包含 UVW 陷门构造、与 Wave 的演进与退化关系分析、参数选择与失败概率分析。安全性层面提供 EUF-CMA（自适应选择消息下的存在不可伪造性）证明框架，具体安全性章节覆盖密钥攻击、码字分布分析和攻击复杂度分析，并进行了参数优化与整体安全评估。规范同时包含性能评估章节，比较不同参数集下的运行效率。","points":["编码类方案；UVW 三分量陷门，从 Wave (U,U+V) 构造扩展而来","均匀输出的域采样（§3.2.3）保证签名分布不泄露密钥信息","EUF-CMA 安全归约；失败概率与分布匹配性分析（§2.3）","密钥攻击与码字分布分析（§3.3.1）；攻击复杂度评估（§3.3.2）","中文规范；参数优化与性能评估均含于文件"],"level1":{"pk":5897612,"sk":40,"sig":1244,"label":"UVW128 (Level 1)","source":"128 位参数摘录自规范（Table 3 (line ~1914-1921): UVW128 Level 1 private key=40B, public key=5897612B, signature=1244B）"},"spec_file":"sig_32_UVW_signature.txt","spec_chars":2095,"text_available":false,"id":"sig-uvw-signature","status":"第一轮候选","first_seen":"2026-09-20","cls":"编码类"},{"name":"VDOO: Vinegar-Diagonal-Oil-Oil","catLabel":"数字签名","cat":"sig","family":"多变量（UOV 变体：Vinegar-Diagonal-Oil-Oil）","assumption":"（文件未提供/不明确——技术正文不在文件中）","summary":"规范文件仅包含方案名称（\"Vinegar-Diagonal-Oil-Oil\"，标识符 PKCSIGN-309598-V1）和提交者/联系方式信息，无任何算法构造、安全分析、参数集或实现细节。方案名称暗示为 UOV 家族的扩展变体，\"Diagonal\"可能指油空间采用对角化或块对角结构。所有技术内容均（文件未提供）。","points":["方案名称暗示 UOV 变体，含\"对角（Diagonal）\
