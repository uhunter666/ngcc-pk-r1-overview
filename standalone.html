","cat":"kem","family":"模块格-非对称 MLWE（Asymmetric Module/Ring-LWE，ARLWE）","assumption":"判定性非对称环-LWE（ARLWE）问题，在 ROM 和 QROM 中均有可证明安全归约。","summary":"Aigis-Enc+ 是 Aigis-Enc 的改进版本，针对 MLWE（ARLWE）问题构造 KEM，目标是实现易于安全实现、整体性能竞争力强、参数选取灵活三大特性。核心创新包括：采用**4 维格明文编码**，使同一 NTT 友好子环（维度 128，模数 q=3329）可服务于不同安全级别；**解密失败率分析放弃独立性假设**，改用数值最坏情况联合界，给出可证明的上界；刻意回避高阶纠错码和浮点运算以减少侧信道攻击面，便于掩码防护。安全分析采用保守的 Core-SVP 模型，并引入 MATZOV 算法应对混合攻击。在 128 比特安全级别下，公钥 698 字节、密文 896 字节；参考实现三操作合计耗时不足 0.10 ms，AVX 优化后低于 0.02 ms。相比 Kyber/ML-KEM，Aigis-Enc+ 保持相近的代数框架，但通过非对称参数设计和更严格的失败率分析进一步提升安全可信度。","points":["统一使用 q=3329、维度-128 NTT，所有参数集共享同一轻量基础。","128 比特安全级别：公钥 698 B，密文 896 B；未使用 RLWR 或稀疏秘密。","安全证明覆盖经典随机预言机模型（ROM）和量子随机预言机模型（QROM）。","保守安全估计：Core-SVP + MATZOV 算法双重校验，不依赖不可靠的独立系数假设。","侧信道友好：无浮点/定点运算，无复杂 ECC，便于常数时间实现与掩码防护。"],"level1":{"label":"Aigis-Enc+-512","pk":656,"sk":16,"sig":null,"ct":896,"source":"n=512, q=3329, chi_alpha=B5, chi_beta=B6, (dt,du,dv)=(10,10,4); pk=seed(16)+compressed_b(640)=656; sk=lambda/8=16 bytes (compact seed representation, confirmed from Table 1 pattern: -512 sk=16, -1024 sk=32, -2048 sk=64); ct=n*(du+dv)/8=512*14/8=896; ss=16 bytes | 128 位参数摘录自规范（Table 1 (line 785): Aigis-Enc+-512 (512,3329) (B5,B6) (10,10,4) |pk|=656 |sk|=16 |C|=896 |ss|=16; all in bytes）"},"spec_file":"kem_01_Aigis-Enc_.txt","spec_chars":42401,"text_available":true,"id":"kem-aigis-enc","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"Amoeba","catLabel":"密钥封装（KEM）","cat":"kem","family":"环-LWE（Ring-LWE，RLWE）","assumption":"判定性环-LWE（RLWE）问题的困难性。","summary":"Amoeba 是一种基于 RLWE 假设的 KEM 方案，以 IND-CPA 安全的 Amoeba.PKE 为基础，通过 FO 变换派生 IND-CCA2 安全的 Amoeba.KEM。在代数结构层面，方案利用环上乘法——支持 Nussbaumer 技巧（非 NTT 友好时的多项式乘法）和标准 NTT 技巧两种路径——以适配不同参数环境。为降低解密失败率（DFR），方案结合误差分布分析选取错误纠正码，并给出噪声估计与参数选择准则。规范专节讨论与现有方案（文件未明示具体方案名称）的差异，涵盖实现细节及评测结果。安全证明在理论层面覆盖 IND-CPA 和 IND-CCA2 两种模型，实际安全估计分析原始攻击、对偶攻击、量子原始/对偶攻击及解密失败攻击。参数与关键尺寸信息（文件未提供）。","points":["基础方案 Amoeba.PKE（IND-CPA）→ FO 变换 → Amoeba.KEM（IND-CCA2）。","多项式乘法支持 Nussbaumer 技巧和 NTT 技巧，适应性强。","明确分析解密失败率：噪声估计 + 纠错码选取双重保障。","安全分析覆盖经典与量子攻击路径（含量子原始/对偶攻击）。","参数集及公钥/密文具体尺寸（文件未提供）。"],"level1":{"label":"Amoeba-576","pk":784,"sk":1712,"sig":null,"ct":1047,"source":"规范 Table 4 直接摘录（pk 784 / sk 1712 / ct 1047 bytes，DFR 2^-133.3） | 128 位参数摘录自规范（Table 4 (line 404): Amoeba-576 Private Key 1712 Public Key 784 Ciphertext 1047 DFR 2^{-133.3}; spec says 5 sets for 128/）"},"spec_file":"kem_02_Amoeba.txt","spec_chars":2340,"text_available":false,"id":"kem-amoeba","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"BAG-Loong","catLabel":"密钥封装（KEM）","cat":"kem","family":"编码-秩度量（Rank-Metric Code-based），增广 Gabidulin 码（Augmented Gabidulin Codes）","assumption":"分块秩综合征解码问题（Blockwise Rank Syndrome Decoding，BRSD）的困难性。","summary":"BAG-Loong 是一种基于秩度量编码的 KEM，以 IND-CPA 安全的 BAG-Loong.PKE 为基础，通过 FO 类变换升级至 IND-CCA2 安全的 BAG-Loong.KEM。方案的核心构件是**增广 Gabidulin 码**（在标准 Gabidulin 码基础上增加冗余结构），以此实现对分块秩解码问题的归约。\"Loong\"（龙）系列定位为较大参数实例，支持与其他无结构密码系统的比较分析。安全分析在经典模型和量子模型两个框架下展开，详细讨论已知组合攻击（含 PRR 攻击）和代数攻击，并给出具体安全强度估计。相较于 HQC 等哈明度量编码方案，秩度量方案通常具有更小的公钥尺寸，但需要代价更高的有限域矩阵运算。公钥/密文具体尺寸（文件未提供）。","points":["安全归约：分块 BRSD 问题，支持经典与量子安全分析。","核心编码工具：增广 Gabidulin 码，比标准 Gabidulin 码具有更强纠错能力。","分析了 PRR 攻击和代数攻击，提供具体安全强度估计。","与其他无结构密码系统作性能对比（文件未给出具体数字）。","参数集、公钥/密文尺寸（文件未提供）。"],"level1":{"pk":2500,"ct":3055,"label":"BAG-Loong-128","source":"128 位参数摘录自规范（Table 3 (line 375): BAG-Loong-128 pk=2500 seed=16 ct=3055; spec text says sk=(X,seed1) but full sk size not listed; sk s）"},"spec_file":"kem_03_BAG-Loong.txt","spec_chars":1620,"text_available":false,"id":"kem-bag-loong","status":"第一轮候选","first_seen":"2026-09-20","cls":"编码类"},{"name":"BAG-Piglet","catLabel":"密钥封装（KEM）","cat":"kem","family":"编码-秩度量（Rank-Metric Code-based），块误差增广 Gabidulin 码（Augmented Gabidulin Codes with Block Errors）","assumption":"分块秩综合征解码问题（BRSD）的困难性。","summary":"BAG-Piglet 全称\"Piglet with Block Errors and Augmented Gabidulin Codes\"，与 BAG-Loong 同属 BAG 系列，采用相同的增广 Gabidulin 码框架，但引入**块误差**（Block Errors）结构，针对小参数实例（\"Piglet\"对应较轻量级别）进行优化。块误差结构对错误向量施加块稀疏约束，可在安全性分析中提供不同的参数权衡空间。安全证明分为理论安全证明（归约到 BRSD 困难问题）和已知攻击分析两部分：后者分别讨论 O-J 组合攻击、PRR 组合攻击和代数攻击，并给出具体安全强度估计。方案通过 FO 变换由 IND-CPA 的 BAG-Piglet.PKE 构造 IND-CCA2 的 BAG-Piglet.KEM，并与其他方案进行性能对比。参数集及尺寸（文件未提供）。","points":["区别于 BAG-Loong：引入块误差结构，针对较小/轻量参数实例优化。","安全分析专门针对 O-J 组合攻击、PRR 攻击和代数攻击三类主要威胁。","增广 Gabidulin 码 + 块误差 = 更紧凑的错误向量支持，有利于安全参数设计。","IND-CCA2 安全通过 FO 变换获得，与 BAG-Loong 框架一致。","参数集、公钥/密文具体尺寸（文件未提供）。"],"level1":{"pk":522,"sk":16,"ct":1011,"label":"BAG-Piglet-128","source":"128 位参数摘录自规范（Table 3 (line 370): BAG-Piglet-128 pk=522 ss_key=16 ct=1011; table caption says 'secret key'; spec notes sk generated fr）"},"spec_file":"kem_04_BAG-Piglet.txt","spec_chars":1635,"text_available":false,"id":"kem-bag-piglet","status":"第一轮候选","first_seen":"2026-09-20","cls":"编码类"},{"name":"BIKE-MLThre","catLabel":"密钥封装（KEM）","cat":"kem","family":"编码-QC-MDPC（Quasi-Cyclic Moderate Density Parity Check，准循环中等密度奇偶校验码）","assumption":"QC-MDPC 码解码困难问题（基于 BIKE 同等假设）。","summary":"BIKE-MLThre 是 BIKE 方案的学习辅助变体，核心创新在于将 BGF 比特翻转解码器中的**静态阈值规则替换为机器学习辅助的自适应残差阈值选择机制**，从而提高解封装可靠性、降低解码失败率（DFR）。解码器在每次迭代中提取紧凑特征向量（综合征权重、迭代索引、黑/灰集合大小、计数器分布统计），输入训练好的低开销推理模块 fθ，输出阈值修正量 ΔTi，叠加到 BGF 基准阈值后通过裁剪约束于合法范围。提供三类参数实例：128 比特（r=12323, w=142, t=134，DFR≤2^{−128}）、256 比特（r=40973, w=274, t=264，DFR≤2^{−256}）、512 比特（r=150001, w=546, t=524，DFR≤2^{−512}）。KEM 构造沿用 BIKE 框架（KeyGen/Encaps/Decaps），哈希原语采用 SHA-384 和 SHAKE256，共享密钥长度 128/256 比特实例为 256 位、512 比特实例为 512 位。","points":["三个参数级别完整参数：(r, w, t) = (12323, 142, 134) / (40973, 274, 264) / (150001, 546, 524)。","自适应阈值：BGF 基准阈值 + 学习残差修正 + 裁剪，学习模块仅在置信度足够时生效。","所有阈值修正仅利用解封装侧内部信息，不增加通信轮次。","DFR 目标分别达到 ≤2^{−128}、≤2^{−256}、≤2^{−512}，可证明优于固定阈值。","基础 KEM 架构与 BIKE 完全兼容，可视为 BIKE 的增强解码器变体。"],"level1":{"pk":1541,"sk":281,"ct":1573,"label":"BIKE_MLThre-128","source":"128 位参数摘录自规范（Table 9 (line 1249): 128: Private key 2244 bits, Public key 12323 bits, Ciphertext 12579 bits; figures in bits, converte）"},"spec_file":"kem_05_BIKE-MLThre.txt","spec_chars":34298,"text_available":true,"id":"kem-bike-mlthre","status":"第一轮候选","first_seen":"2026-09-20","cls":"编码类"},{"name":"BRA","catLabel":"密钥封装（KEM）","cat":"kem","family":"编码-秩度量（Rank-Metric Code-based），理想分块结构增广 Gabidulin 码","assumption":"理想分块秩综合征解码问题（Ideal Blockwise Rank Syndrome Decoding，Ideal BRSD）的困难性。","summary":"BRA 是一种基于秩度量编码的 KEM，以理想（Ideal）分块 BRSD 困难问题为安全基础。\"Ideal\"结构意味着公钥矩阵具有特殊循环或准循环代数形式，可降低密钥尺寸并提升效率。核心编码工具同为增广 Gabidulin 码，方案由 BRA.PKE（IND-CPA）经 FO 变换升级至 BRA.KEM（IND-CCA2）。安全分析覆盖经典与量子两种模型，分析组合攻击（第 7.1 节）和代数攻击（第 7.2 节），以及对量子攻击的抵抗性（第 7.3 节），并给出具体安全强度估计。相比 BAG-Loong/BAG-Piglet，BRA 采用更结构化的代数框架（\"Ideal BRSD\"），在保持安全假设成立的前提下获得更紧凑的参数。提供参考实现和优化实现两个版本。参数集及公钥/密文尺寸（文件未提供）。","points":["基于 Ideal BRSD 问题（含理想结构），安全性比普通 BRSD 更高效但需额外假设。","增广 Gabidulin 码 + 理想结构 → 比非结构化秩度量方案更紧凑。","安全分析覆盖经典与量子模型，包括对量子攻击的专项分析。","提供参考与优化两种实现版本。","参数集及公钥/密文/私钥尺寸（文件未提供）。"],"level1":{"pk":1078,"sk":98,"ct":2092,"label":"BRA-128","source":"128 位参数摘录自规范（Table 1 (line 31): BRA-128 sks=98 pks=1078 cts=2092 total=3170 |K|=64 DFR=2^{-130}; header: all sizes in bytes）"},"spec_file":"kem_06_BRA.txt","spec_chars":1615,"text_available":false,"id":"kem-bra","status":"第一轮候选","first_seen":"2026-09-20","cls":"编码类"},{"name":"BRQC","catLabel":"密钥封装（KEM）","cat":"kem","family":"编码-秩度量（Rank-Metric Code-based），准循环结构标准 Gabidulin 码（Quasi-Cyclic Gabidulin Codes）","assumption":"理想分块秩综合征解码问题（Ideal BRSD）的困难性（同 BRA，但使用标准而非增广 Gabidulin 码）。","summary":"BRQC（Blockwise Rank Quasi-Cyclic）与 BRA 构成兄弟方案，同样基于理想分块 BRSD 困难问题，但核心编码工具从**增广 Gabidulin 码改为标准 Gabidulin 码**，取消\"增广\"扩展以换取更简洁的代数结构。方案由 BRQC.PKE（IND-CPA）经 FO 变换升级至 BRQC.KEM（IND-CCA2）。安全分析框架与 BRA 高度一致：组合攻击（7.1 节）、代数攻击（7.2 节）、量子攻击抵抗性（7.3 节）及具体安全强度估计（7.4 节）。\"QC\"暗示准循环结构，公钥可被压缩存储，体积更小。BRQC 与 BRA 的主要设计差异在于 Gabidulin 码的选取策略，两者在相同安全级别下的效率权衡有所不同。参数集及公钥/密文具体尺寸（文件未提供）。","points":["使用标准 Gabidulin 码（非增广），结构更简洁，与 BRA 构成设计对比。","准循环（QC）结构允许公钥压缩，密钥体积更紧凑。","安全分析框架与 BRA 一致，覆盖组合、代数及量子攻击。","基于 Ideal BRSD 困难问题，在结构化假设下提供安全性。","参数集、公钥/密文具体尺寸（文件未提供）。"],"level1":{"pk":1954,"sk":112,"ct":3844,"label":"BRQC-128","source":"128 位参数摘录自规范（Table 1 (line 31): BRQC-128 sks=112 pks=1954 cts=3844 total=5798 |K|=64 DFR=Null; all sizes in bytes）"},"spec_file":"kem_07_BRQC.txt","spec_chars":1615,"text_available":false,"id":"kem-brqc","status":"第一轮候选","first_seen":"2026-09-20","cls":"编码类"},{"name":"BW-KEM","catLabel":"密钥封装（KEM）","cat":"kem","family":"模块格-LWE（Module-LWE），结合 Barnes-Wall 格码纠错","assumption":"模格上的判定性 MLWE（Module Learning With Errors）问题。","summary":"BW-KEM 以 MLWE 为安全基础，其核心创新是将**可扩展嵌套 Barnes-Wall 格编码框架**用于错误纠正，替代传统方案中的直接取模或 ECC 拼接方法。Barnes-Wall 格具有递归结构，可高效适配多维参数且支持纯整数算术（无浮点/有理数运算），天然适合常数时间实现。方案由 BW-PKE（IND-CPA）经 FO 变换升级至 BW-KEM（IND-CCA2）。DFR 分析放弃噪声系数独立性假设，建立精确的渐近近似方法。方案与 ML-KEM 完全兼容：使用相同的模数 q 和多项式维度，可复用现有 NTT 单元和算术流水线，并已在 PKC 2026 发表初始版本。参数选取基于 Core-SVP 安全模型。支持 x86 和 ARM Cortex-M4 两种平台实现。","points":["核心创新：可扩展嵌套 Barnes-Wall 格编码替代传统 ECC，提升纠错能力和 DFR 分析精度。","与 ML-KEM 共享模数 q 和多项式维度，可无缝替换错误纠正模块，迁移成本低。","DFR 分析不依赖独立性假设，结果更严格可靠。","全整数算术，无浮点/有理数运算，易于常数时间实现。","支持 x86（含 AVX 优化）和 ARM Cortex-M4 平台。"],"level1":{"label":"BW-KEM-c128","pk":784,"sk":1585,"sig":null,"ct":768,"source":"规范 Table 4 直接摘录（pk 784 / sk 1585 / ct 768 bytes） | 128 位参数摘录自规范（Table 2 (line 1518): BW-KEM-c128 BW8 N=256 q=3329 l=2 |pk|=784 |ct|=768 |K|=16; sk not listed in table）"},"spec_file":"kem_08_BW-KEM.txt","spec_chars":43399,"text_available":true,"id":"kem-bw-kem","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"CheetahKEM","catLabel":"密钥封装（KEM）","cat":"kem","family":"模块格/环-LWE（Module-LWE / Ring-LWE）","assumption":"模/环格上的 MLWE/RLWE 问题（Cheetah128 基于 RLWE；Cheetah256/384/512 基于 MLWE）。","summary":"CheetahKEM 是面向多安全级别的 LWE 类 KEM，采用环 Rq = Zq[X]/(X^N+1)，N=640，q=7681。Cheetah128 使用 k=1（RLWE），Cheetah256/384/512 使用不同维度的模块（MLWE）。核心构造以 IND-CPA 安全的 Cheetah-PKE 为基础，通过两步 FO 变换升级为 IND-CCA2 安全的 KEM。加密过程引入 Truncate 操作截断 c2 的高次项以压缩密文。解密采用类 NTRU 的技术思路，通过 u = 2(c2 − Truncate(c1^T s)) mod q 后取 mod 2 恢复明文，无需拒绝采样。多项式乘法采用 Good-Thomas 分解（NTT640 = NTT128 × NTT5），高效利用 N=640=128×5 的复合结构。参数兼顾安全性与效率，文件给出的规范为中文版，详细定义了位/字节转换、Compress/Decompress 等辅助函数。","points":["参数：N=640，q=7681；Cheetah128（k=1，RLWE）/ Cheetah256/384/512（k>1，MLWE）。","采用 Good-Thomas NTT 分解（NTT128 × NTT5），高效处理 N=640 的非 2 次幂维度。","密文压缩通过 Truncate 操作实现，降低通信开销。","解密无需拒绝采样，逻辑简洁。","IND-CCA2 安全通过两步 FO 变换获得；中文规范提供完整伪代码。"],"level1":{"label":"Cheetah128","pk":832,"sk":1936,"sig":null,"ct":864,"source":"N=640, k=1, q=7681, lambda=128, eta=5, (db,du,dv)=(10,10,4), DFR=2^-129; eksize=lambda/8+kN*db/8+16=16+800+16=832; ct=(kN*du+lambda*dv)/8=(6400+512)/8=864; dksize=kN*ceil(log2q)/8+eksize+|H(ek)|+lambda/8+16=1040+832+32+32=1936 where |H(ek)|=32 (SHA3-256); formulas from spec lines 1783-1808 | 128 位参数摘录自规范（Table 3 (lines 925-929): Cheetah128 sk:1936 pk:832 ct:864 (size in bytes)）"},"spec_file":"kem_09_CheetahKEM.txt","spec_chars":18997,"text_available":true,"id":"kem-cheetahkem","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"C-Multi-UR-AG","catLabel":"密钥封装（KEM）","cat":"kem","family":"编码-秩度量（Rank-Metric Code-based），无结构多块增广 Gabidulin 码（Unstructured Multi-block Augmented Gabidulin Codes）","assumption":"秩综合征解码问题（Rank Syndrome Decoding，RSD）及 RSL（Rank Syndrome Learning）问题的困难性。","summary":"C-Multi-UR-AG 是基于秩度量编码的 KEM，以 RSD 和 RSL 问题为安全基础。相较于 BRA 和 BRQC 的理想/准循环代数结构，本方案采用**无结构（Unstructured）的多块矩阵公钥**（\"UR\"=Unstructured Rank），利用增广 Gabidulin 码进行消息编码和解码，通过 FO 变换由 C-Multi-UR-AG.PKE（IND-CPA）升级为 C-Multi-UR-AG.KEM（IND-CCA2）。\"Multi\"暗示采用多个码块或多个未知量的扩展构造。无结构化设计规避了代数结构可能带来的特殊攻击（如 Frobenius/Folding 攻击），以更大的密钥尺寸换取更保守的安全假设。安全分析覆盖组合攻击、代数攻击和量子攻击，给出具体安全强度估计。参数集及公钥/密文尺寸（文件未提供）。","points":["安全基础为 RSD + RSL 两个困难问题，比单一 BRSD 更广泛。","无结构公钥矩阵（UR），对比 BRA/BRQC 的理想/准循环结构，安全假设更保守。","使用增广 Gabidulin 码，与 BAG-Loong/BRA 系列共用同类编码工具。","\"Multi\"扩展（多块/多未知量）提升安全余量，代价是密钥尺寸增大。","参数集及公钥/密文具体尺寸（文件未提供）。"],"level1":{"pk":3866,"sk":94,"ct":7332,"label":"Level-128","source":"128 位参数摘录自规范（Table 1 (line 33): Level-128 sks=94 pks=3866 cts=7332 total=11198 |K|=64 DFR=2^{-148}; all sizes in bytes）"},"spec_file":"kem_10_C-Multi-UR-AG.txt","spec_chars":1511,"text_available":false,"id":"kem-c-multi-ur-ag","status":"第一轮候选","first_seen":"2026-09-20","cls":"编码类"},{"name":"COMPASS-KEM","catLabel":"密钥封装（KEM）","cat":"kem","family":"模块格-LWR（Module Learning with Rounding，MLWR），素模数变体","assumption":"素模数上的判定性 MLWR 问题（具有从标准 MLWE 问题的可证明归约）。","summary":"COMPASS-KEM 是基于 MLWR 问题的 KEM，以 MLWR 替代 MLWE 中的显式噪声采样，利用**取整（Rounding）操作**在确定性地引入\"噪声\"的同时规避误差采样，降低侧信道风险。与早期 SABER（基于 2 的幂次模数）不同，COMPASS-KEM 采用**素模数**（n=256，q=3329；或 n=512，q=7681），使得 NTT 可用，大幅提升效率。安全性具备从 MLWE 的严格归约，并修复了 SABER 原始安全证明中的一个缺陷。支持四个安全类别：128 比特（80 比特量子安全）、256 比特（128 比特量子安全）、384 比特（192 比特量子安全）、512 比特（256 比特量子安全）。公钥经过压缩，比同安全级别的 ML-KEM 小约 16%；256 比特安全级别下密文亦小于 ML-KEM。方案主张无 ML-KEM 相关知识产权纠纷。提供可移植 ANSI C 基线实现和 AVX2 优化实现。","points":["安全基于素模数 MLWR，具有从 MLWE 的可证明归约，修复了 SABER 安全证明的缺陷。","支持 4 个安全级别：128/256/384/512 比特经典（80/128/192/256 比特量子安全）。","素模数（q=3329 或 q=7681）支持 NTT，比 SABER 的 2 次幂模数效率更高。","公钥尺寸比同安全级别 ML-KEM ≤84%；无显式噪声采样，对侧信道更友好。","提供 ANSI C 参考实现和 AVX2 优化实现，主张不存在 IP 纠纷。"],"level1":{"label":"COMPASS-KEM-128","pk":672,"sk":1504,"sig":null,"ct":768,"source":"128-bit classical security; all three byte sizes from Table 2; based on Module-LWR and biased Module-LWR assumptions | 128 位参数摘录自规范（Table 2 (line 851): COMPASS-KEM-128 128 bit Public Key 672 Private Key 1504 Ciphertext 768; all in bytes）"},"spec_file":"kem_11_COMPASS-KEM.txt","spec_chars":22425,"text_available":true,"id":"kem-compass-kem","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"CTL Algorithm","catLabel":"密钥封装（KEM）","cat":"kem","family":"NTRU 格（NTRU Lattice），结合环-LWR（Ring-LWR）的混合构造","assumption":"判定性 NTRU 假设与搜索 Ring-LWR 假设的组合困难问题。","summary":"CTL 算法基于 NTRU 格优化架构，安全性建立在 NTRU 问题与 Ring-LWR 问题的混合假设之上，追求极致紧凑的参数体系。主要创新点包括：（1）引入**混合采样器**生成高质量 NTRU 陷门对 (f, g)，利用分圆环傅里叶嵌入在频域近似均匀采样并结合舍入误差补偿，直接在分布层面约束陷门质量；（2）设计**前置有效性判定条件**和**自适应迭代终止策略**，提升 NTRU 方程求解效率；（3）引入 ReducePartial 迭代优化策略和轻量级中间验证机制，降低求解失败率和栈空间开销。解密过程仅需少量基础代数运算，代码量精简，编码/存储/解码工程化设计覆盖多梯度安全级别。解码采用基于 NTRU 格的 Babai 类算法（Rounding Off + Nearest Plane + GGH-Micciancio 范式融合）。具体参数值（文件未提供）。","points":["安全双重假设：判定 NTRU + 搜索 Ring-LWR，两者组合提供更保守的安全依据。","混合采样器在频域约束陷门质量，避免传统\"后验筛选\"流程的低效性。","ReducePartial 迭代策略 + 轻量级中间验证，降低密钥生成失败率。","解密流程基于 Babai RO+NP+GGH-Micciancio 融合解码器，无复杂 ECC。","具体参数（模数、维度、公钥/密文尺寸）文件未提供。"],"level1":{"pk":521,"sk":417,"ct":473,"label":"CTL-128","source":"128 位参数摘录自规范（Table 3 (line 1222): CTL-128 Public Key 521, Ciphertext 473, Private Key Short Format 417; unit bytes）"},"spec_file":"kem_12_CTL_Algorithm.txt","spec_chars":20786,"text_available":true,"id":"kem-ctl-algorithm","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"DKEM (Ding Key Encapsulation)","catLabel":"密钥封装（KEM）","cat":"kem","family":"模块格-LWE（Module-LWE），带调和机制（Reconciliation-based）","assumption":"模格上的判定性 MLWE（Module Learning With Errors）问题。","summary":"DKEM 是 Ding 密钥交换（Ding Key Exchange）的模块格提升版，通过增加信号比特数改进调和机制，并经 tag-based FO 变换（FO^⊥_{ID(pk),m}）构造 IND-CCA 安全的 KEM。核心协议 DKE 将 Ding KE 中的向量空间 Z_q^n 替换为模块 R_q^k，公开矩阵采用与 ML-KEM 相同的结构化 MLWE 矩阵（从种子确定性展开），双方通过交换含噪声的模块元素并经调和函数映射至相同比特串。DKEM 与 ML-KEM 共享参数框架：主要实例使用 Rq = Zq[X]/(X^256+1)，q=3329，k∈{2,4}，分别对应 ML-KEM-512 和 ML-KEM-1024；另提供 Rq = Zq[X]/(X^512+1)，q=7681，k=4 的高安全实例（512 比特经典安全）。IND-CCA 安全证明以 MLWE 假设为基础，并分析了调和失败攻击等额外威胁。","points":["三个参数集：(n=256, q=3329, k=2)、(n=256, q=3329, k=4)、(n=512, q=7681, k=4)，对应 128/256/512 比特安全级别。","相比 ML-KEM，将隐式 FO 压缩替换为显式调和机制，透明展示密钥协商直觉。","采用 tag-based FO 变换获得 IND-CCA 安全，与 ML-KEM 使用的 FO 变换有所区别。","与 ML-KEM 共享代数框架（同环、同模数），实现代码高度可复用。","额外分析调和失败攻击、量子安全性和精细门计数估计。"],"level1":{"pk":800,"sk":1600,"ct":800,"label":"DKEM-128","source":"128 位参数摘录自规范（Table 2 (line 1292): DKEM-128 Public key 800 Secret key 1600 Ciphertext 800 Shared secret 32; sizes in bytes）"},"spec_file":"kem_13_DKEM_Ding_Key_Encapsulation_.txt","spec_chars":36496,"text_available":true,"id":"kem-dkem-ding-key-encapsulation","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"DTRU","catLabel":"密钥封装（KEM）","cat":"kem","family":"NTRU 格（NTRU Lattice），三分圆环主实例，辅以 LPPNF 和 2 次幂分圆环变体","assumption":"NTRU 假设与环-LWE 假设的联合困难问题，可证明 IND-CCA 安全。","summary":"DTRU 是基于 NTRU 框架的 KEM，核心创新是**双 E8 编码**（Double E8 Encoding）：将 4 比特消息先通过 E8 格的 4 维子格对应的 [8,4,4] 扩展 Hamming 码编码为 8 比特码字，再经 NEV 式重复编码扩展为 16 坐标，映射 4 比特→16 坐标（最小 Hamming 距离 8），获得出色的纠错能力。缩放后的双 E8 码最小欧氏距离 ≥ √2(q−1)，保证正确解码。主实例采用**三分圆环**（tricyclotomic，Zq[x]/(x^n − x^{n/2} + 1)），p=2 的误差结构在此环上最小化误差率；此外提供 DTRU-Prime（LPPNF，大 Galois 群素次素理想数域，抵抗代数攻击）和 DTRU-Light（2 次幂分圆环，更轻量）两个变体。方案通过 FO^⊥_{ID(pk),m}+ 变换获得 IND-CCA 安全，私钥 f = pf'+1 设计保证可逆性。参数采用保守策略：不使用稀疏噪声，中心二项分布参数 η≥2。","points":["双 E8 编码：[8,4,4] E8 子格码 + NEV 重复 → 16 坐标，最小 Hamming 距离 8，纠错能力优于 Kyber/Falcon 等方案的简单取整编码。","主实例三分圆环 Zq[x]/(x^n − x^{n/2}+1)，p=2；DTRU-Prime（LPPNF）抵抗代数攻击；DTRU-Light（2 次幂分圆环）轻量版本。","IND-CCA 安全联合依赖 NTRU 假设和 Ring-LWE 假设，双重安全基础。","保守噪声参数：不使用稀疏分布，η≥2 的中心二项分布，抵抗 Hybrid/DOOM 攻击。","密文含两步压缩（q → q2），公钥/密文具体尺寸（文件未提供）。"],"level1":{"label":true,"pk":972,"sk":1328,"sig":null,"ct":729,"source":"DTRU-648，128-bit/NIST Cat.1，来自规范Table 2（未压缩值）；压缩版: pk=954, sk=1310 | 128 位参数摘录自规范（Table 6 (line 885): DTRU-Light PK 640(615) CT 512 SK 864(839); DTRU-Light targets 128-bit classical security (Table 2 li）"},"spec_file":"kem_14_DTRU.txt","spec_chars":40994,"text_available":true,"id":"kem-dtru","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"FLIT","catLabel":"密钥封装（KEM）","cat":"kem","family":"模块格-NTRU / 模块格-LWE（双重安全基础）","assumption":"模块-LWE 与模块-NTRU 的联合困难性（Module-LWE + Module-NTRU 问题）。","summary":"Flit 是基于 NTRU 的 IND-CCA2 密钥封装机制，安全性同时建立在 LWE 和 NTRU 的模块版本之上。核心构造分两层：首先构造 Flit.CPAPKE（CPA 安全的 PKE），再经 FO 变换得到 Flit.CCAKEM。关键创新是引入\"同态编码与解码\"（Homomorphic Encoding/Decoding）技术，利用重复码将低阶比特信息结构化地嵌入密文，从而降低解密失败率（DFR）。多项式环为 R = Z[X]/(X^N+1)，参数集 (N,q) ∈ {(512,769), (1024,769), (2048,3329)}，覆盖三个安全等级；512 位安全等级下哈希函数输入/输出扩展至 64 字节。实现采用 NTT 结合 Karatsuba 分治乘法（在 N/k 个子环 Z_q[X]/(X^k−ζ) 上高效完成多项式乘积），提供参考实现与 AVX2 优化版本。与纯 NTRU 方案（如 NTRU+）相比，Flit 引入模块结构使参数选取更灵活；与 Kyber 相比，Flit 属于 NTRU 族，密钥生成不需要矩阵行列式可逆性条件。","points":["参数集 (N,q) ∈ {(512,769),(1024,769),(2048,3329)}，分别对应三个安全等级","模块-LWE + 模块-NTRU 双重安全基础，比单一 NTRU 假设更稳健","核心创新：同态编码/解码，利用重复码改善 DFR，无需独立性假设","NTT + Karatsuba 递归乘法加速，提供参考实现与 AVX2 优化实现","具体公钥/密文字节尺寸（文件未提供/不明确）"],"level1":{"label":true,"pk":640,"sk":1376,"sig":null,"ct":512,"source":"Flit128: N=512,n=256,q=769,d=8；pk=N·⌈log₂q⌉/8=640；ct=N·d/8=512；sk由CCA-KEM算法计算(sk'||pk||H(pk)||ρ)=672+640+32+32=1376，均为计算值 | 128 位参数摘录自规范（Table 11 (line 1289): FLIT128 Secret Key 839 Public Key 615 Ciphertext 512; all in bytes）"},"spec_file":"kem_15_FLIT.txt","spec_chars":52592,"text_available":true,"id":"kem-flit","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"HARE","catLabel":"密钥封装（KEM）","cat":"kem","family":"编码-拟循环综合征解码（HQC 变体）","assumption":"非平衡拟循环综合征解码（Unbalanced Quasi-Cyclic Syndrome Decoding，UQCSD）问题的困难性。","summary":"HARE 是对 HQC 的带宽优化变体，整体框架与 HQC 高度相似（相同的安全假设和 FO 变换路径），目标是在保持可证 IND-CCA2 安全和低 DFR 的同时显著降低公钥与密文的通信开销。核心改进是在 Reed-Muller（RM）解码阶段引入\"距离知情擦除解码\"（Distance-Informed Erasure Decoding）策略：对 RM 解码输出置信度较低的符号块标记为\"擦除\"，随后由 Reed-Solomon（RS）解码器进行擦除纠正而非错误纠正，从而在相同码参数下显著降低 DFR，进而允许缩短串联码的总长度并压缩密钥/密文尺寸。HARE 还同时引入三项辅助优化：非平衡误差权重模型、基于改进覆盖码的密文压缩技术，以及更精细的 DFR 估计模型。与 HQC 对比，HARE 在 NIST 安全等级 1、3、5 下分别将公钥+密文总尺寸降低约 15.5%、14.8%、15.2%，同时保留了与 HQC 相同的安全假设体系，无需引入额外假设。","points":["安全假设与 HQC 相同（UQCSD），IND-CCA2 经 FO 变换建立，无额外假设","核心创新：RM 解码阶段距离知情擦除策略，显著降低 DFR、缩短码长","三项辅助优化：非平衡误差权重 + 改进覆盖码密文压缩 + 精细 DFR 估计","公钥+密文总尺寸比 HQC 降低约 15%（三个 NIST 安全等级均如此）","具体参数集字节尺寸（文件未提供/不明确，已知优于标准 HQC）"],"level1":{"pk":2025,"sk":2073,"ct":3608,"label":"HARE-1","source":"128 位参数摘录自规范（Table 3 (line 653): HARE-1 classical 128 quantum 64 ekKEM=2025 dkKEM=2073 cKEM=3608 K=16; all sizes in bytes）"},"spec_file":"kem_16_HARE.txt","spec_chars":52866,"text_available":true,"id":"kem-hare","status":"第一轮候选","first_seen":"2026-09-20","cls":"编码类"},{"name":"Hybrid Equivalent Punctured and Quasi-Cyclic","catLabel":"密钥封装（KEM）","cat":"kem","family":"编码-等价穿孔码（EPC）与拟循环综合征解码的混合","assumption":"EPC-P（带奇偶校验约束的等价穿孔码）困难问题，以及 2-DQCSD-P 和 3-DQCSD-P（拟循环综合征解码问题的分布变体）。","summary":"HEP-QC 是在 HQC 框架上叠加码等价类型假设所构造的 KEM，其安全性由两条独立归约路径共同保护。第一条归约到 EPC-P 问题，用于保障公钥中结构化分量的不可区分性（公钥结构隐藏）；第二条归约到 2-DQCSD-P 和 3-DQCSD-P 问题，用于控制公钥和挑战密文中噪声分布的不可区分性。这一双重归约结构使得攻击者须同时突破两类独立困难问题，比 HQC 的单一 QCSD 归约具有更强的结构隐藏性和更审慎的安全论证。基础环为 F2[X]/(X^n−1)（n 为本原素数），采用拟循环/不平衡拟循环码，消息编码与 HQC 相同（串联 Reed-Muller + Reed-Solomon 码）。经盐化 FO 变换（含隐式拒绝）获得 IND-CCA2 安全的 KEM，并分别提供非均匀随机采样下的安全证明。与 HQC 相比，EPC-P 层的加入不改变安全等级所需的 QCSD 硬度，但额外保护了公钥的代码等价结构，提高了对结构化公钥攻击的抵抗力。提供性能测试与 KAT 向量。","points":["双重独立安全归约：EPC-P（公钥结构隐藏）+ 2/3-DQCSD-P（噪声分布），优于 HQC 单一归约","基础环：F2[X]/(X^n−1)，n 为本原素数；拟循环/不平衡拟循环码结构","经盐化 FO 变换 + 隐式拒绝实现 IND-CCA2；另含非均匀随机采样安全证明","消息编码：串联 Reed-Muller + Reed-Solomon 码（与 HQC 相同）","具体参数集字节尺寸（文件未提供/不明确）；声称覆盖 NIST 安全等级 1/3/5"],"level1":{"pk":285889,"sk":285969,"ct":4433,"label":"HEP-QC-1","source":"128 位参数摘录自规范（Table 4.2 (line 783): HEP-QC-1 128-bit ekKEM=285889 dkKEM=285969 cKEM=4433 K=32; all in bytes）"},"spec_file":"kem_17_Hybrid_Equivalent_Punctured_and_Quasi-Cyclic.txt","spec_chars":40784,"text_available":true,"id":"kem-hybrid-equivalent-punctured","status":"第一轮候选","first_seen":"2026-09-20","cls":"编码类"},{"name":"LoongKEM","catLabel":"密钥封装（KEM）","cat":"kem","family":"模块格-LWE（混合循环/负循环环，Loong 环结构）","assumption":"模块-LWE（MLWE）困难问题。","summary":"LoongKEM 是基于模块-LWE 困难性的 IND-CCA2 安全 KEM，其最显著的结构特点是引入\"Loong 环\"混合结构：公钥矩阵 A 具有块状形式 [[A1, A2], [A3, A4]]，其中 A1、A2、A3 等块定义在循环环 Zq[X]/(X^N−1) 上（普通循环卷积），而 A4 块定义在负循环环 Zq[X]/(X^N+1) 上，两类环在同一矩阵框架中共存。密钥生成时，大矩阵 A 从对应环上均匀采样，秘密矩阵 [S1; S2] 和噪声矩阵 [E1; E2] 均从小分布 ψ_η 采样，公钥 B = A·[S1; S2] + [E1; E2]。加密输出三元组密文 (C1, C2, C3)，解密计算 U = 2(C3 − C1·S1 − C2·S2) mod ±q，最终 M = U mod 2。经 FO 变换转化为 IND-CCA2 安全 KEM。规范以中文撰写，提供了从 LWE 到 SIS 问题历史演进的背景介绍，并涵盖字节编解码（BitsToBytes、BytesToBits、ByteEncode、ByteDecode 等）的完整工具函数规范。文件编码存在损坏，完整参数集尺寸不明确。","points":["混合环设计：\"Loong 环\"在同一矩阵中融合循环环 Zq[X]/(X^N−1) 与负循环环 Zq[X]/(X^N+1)","模块结构，参数 k1、k2 控制秘密向量维度（具体取值文件未明确）","解密路径 M = (2(C3−C1S1−C2S2) mod ±q) mod 2，无 NTRU 逆元计算","经 FO 变换实现 IND-CCA2；规范以中文撰写，含详细字节级编解码工具函数","文件编码有损，完整参数集及公钥/密文字节尺寸（文件未提供/不明确）"],"level1":{"pk":1472,"sk":1832,"ct":1512,"label":"Loong128","source":"128 位参数摘录自规范（Table 3 (lines 1192-1194): Loong128 sk:1832 pk:1472 ct:1512 size in bytes）"},"spec_file":"kem_18_LoongKEM.txt","spec_chars":19479,"text_available":true,"id":"kem-loongkem","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"Lore","catLabel":"密钥封装（KEM）","cat":"kem","family":"模块格-LWR（CRT 变模压缩，Module-LWR 变体）","assumption":"CRT-MLWR（中国剩余定理版模块舍入学习）困难问题，可形式归约到标准 MLWR。","summary":"Lore 是基于 Module-LWR 的 IND-CCA2 KEM，核心创新是两项协同技术。**变模（Variable Modulus）**：采用复合模 tq（固定 q=257，安全等级决定小正整数 t），将解密失败率（DFR）与模数大小解耦，使各安全级别的 DFR 严格低于 2^{−λ}，满足 FO 变换对 DFR 的要求而无需查询次数限制。**CRT 压缩**：利用中国剩余定理将 Ztq 的元素分解为模 Zq 和 Zt 的两个残差，经受控舍入步骤显著缩减公钥和密文尺寸；引入的噪声分布类比 LWR，相应 CRT-LWR 困难性可严格归约到标准 LWR。在量子随机预言机模型（QROM）中建立完整 IND-CCA2 证明。提供 128/256/384/512 位古典安全四个参数集（满足 NGCC 需求）：Lore-128 公钥 545B、密文 641B（总带宽 1186B）；Lore-256 公钥 1058B、密文 1153B（总带宽 2211B）。相比 Kyber，Lore 公钥+密文总尺寸小 25%–30%，综合代价（含传输开销）小 20%–24%。","points":["双核心技术：变模（q=257, 安全级别依赖的 t）+ CRT 压缩，显著缩减带宽","DFR 无条件低于 2^{−λ}（如 256 位安全 DFR = 2^{−266}），满足 FO 变换安全要求","Lore-128：PK=545B, CT=641B；Lore-256：PK=1058B, CT=1153B","比 Kyber 同等安全级别带宽小 25%–30%，综合代价小 20%–24%","QROM 下完整安全证明，四个参数集覆盖 128–512 位古典安全"],"level1":{"label":true,"pk":545,"sk":821,"sig":null,"ct":641,"source":"Lore-128，来自规范Table 1比较表：|PK|=545, |CT|=641, 带宽=1186；sk_bytes未在可读文件范围内明确给出 | 128 位参数摘录自规范（Table 3 (line 1446): Lore-128 DFR=-128.81 Ciphertext 641 Public key 545 Secret key 821 CT+PK 1186）"},"spec_file":"kem_19_Lore.txt","spec_chars":38667,"text_available":true,"id":"kem-lore","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"MAMBA-Frost","catLabel":"密钥封装（KEM）","cat":"kem","family":"普通格-LWQ（Learning with Quantization，非结构化整数矩阵，无多项式环）","assumption":"Learning With Quantization（LWQ）困难问题，可紧、样本保留地归约到标准非结构化 LWE。","summary":"MAMBA-Frost（简称 Frost）是基于 LWQ 困难问题的 KEM，运行在非结构化整数矩阵上——无多项式环、无模块结构、无 NTT、无高斯采样、无拒绝采样，是 FrodoKEM 方向的方案。核心思想：通过**公开颤抖（Public Dithering）量化**使量化噪声与隐藏输入统计独立，使 LWQ 转录可与标准 LWE 建立紧、样本保留的对应关系，突破了 LWR 中舍入噪声与秘密线性相关所导致的归约松弛问题。消息编码引入 E8 格编码以提升正确性边界，全程使用 2 的幂算术（移位和掩码实现），实现简洁且便于常数时间工程。提供五档安全配置（128–512 位），最高两档另有紧密文变体（-CC 后缀）。IND-CCA 安全经 FO 变换建立。Frost-128 公钥 5152B、密文 5192B，AVX2 实现 KeyGen/Encap/Decap 约 401/569/666 kCycles；尺寸大是非结构化 LWE 的固有代价，换取最保守的安全基础。","points":["无环、无 NTT、无拒绝采样，基于非结构化 LWE（类 FrodoKEM），安全基础最保守","公开颤抖量化使噪声与秘密统计独立，实现 LWQ→LWE 紧样本保留归约","E8 格消息编码提升正确性，全程 2 的幂算术（移位/掩码）","Frost-128：PK=5152B, CT=5192B；AVX2 约 401/569/666 kCycles（KeyGen/Encap/Decap）","五档安全（128–512 位）；提供参考实现、AVX2 实现，含 Cortex-M4 实现"],"level1":{"label":true,"pk":5152,"sk":6736,"sig":null,"ct":5192,"source":"Frost-128，基于非结构化LWQ问题，来自规范参数表 | 128 位参数摘录自规范（Table 2 (line 165): Frost-128 |pk|=5152 |ct|=5192 |skKEM|=6736 log2delta=-169.44）"},"spec_file":"kem_20_MAMBA-Frost.txt","spec_chars":60179,"text_available":true,"id":"kem-mamba-frost","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"MAMBA-Viper","catLabel":"密钥封装（KEM）","cat":"kem","family":"模块格-LWQ（Module Learning with Quantization，幂次二模数多项式环）","assumption":"Module Learning With Quantization（MLWQ）困难问题，可直接归约到标准 MLWE。","summary":"MAMBA-Viper（简称 Viper）是基于 MLWQ 困难性的 KEM，将模块结构（类 Kyber）与量化机制（类 Saber）结合，同时弥补两者的不足：相比 Kyber（MLWE）实现原生带宽压缩；相比 Saber（MLWR）通过量化噪声与秘密统计独立性，实现直接 MLWQ→MLWE 归约而无需启发式噪声合并论证。多项式环维度 n=256，模数 q=2^12（最高两档用 q=2^13）为 2 的幂，多项式乘法使用 Toom-Cook/Karatsuba 算法。消息编码引入 E8 格标注（Labeling/Delabeling）提升正确性边界。提供五档参数集（128/192/256/384/512 位）：Viper-128 PK=608B、CT=736B、SK=1424B；Viper-512 PK=3200B、CT=3456B。MATZOV 模型下古典安全分别为 141.9/199.4/266.0/410.2/564.6 位。安全证明在 ROM 和 QROM 下均成立。提供参考实现、AVX2 优化实现和 Cortex-M4 实现，并附完整 KAT 向量验证。","points":["模块-LWQ，模数 q=2^12（高安全档 2^13），环维度 n=256；Toom-Cook/Karatsuba 乘法","量化噪声与秘密统计独立，实现严格 MLWQ→MLWE 归约（优于 Saber 的近似论证）","五档参数：Viper-128(PK=608B, CT=736B) 至 Viper-512(PK=3200B, CT=3456B)","MATZOV 古典安全：141.9/199.4/266.0/410.2/564.6 位（五档）","E8 格消息编码；提供参考/AVX2/Cortex-M4 三套实现，含完整 KAT 验证"],"level1":{"label":true,"pk":608,"sk":1424,"sig":null,"ct":736,"source":"Viper-128，基于模块LWQ问题，来自规范参数表 | 128 位参数摘录自规范（Table 2 (line 156): Viper-128 |pk|=608 |ct|=736 |sk|=1424; MATZOV(C)=141.9）"},"spec_file":"kem_21_MAMBA-Viper.txt","spec_chars":52876,"text_available":true,"id":"kem-mamba-viper","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"Mithril","catLabel":"密钥封装（KEM）","cat":"kem","family":"根式环-LWR（Radical Ring Learning With Rounding，RR-LWR）","assumption":"根式环舍入学习（RR-LWR）困难问题，是 Ring-LWR 的特例，可视为 Module-LWR 的替代方案。","summary":"Mithril 是 ARCANE 套件中的 KEM，与签名方案 ARCANE-Octarine 共享同一代数基础——根式环 Sq,n,k = (Zq[y]/(y^n+1))[x]/(x^k − y − 2)，该环是 2n 次分圆域的 k 次根式扩张，同构于 Ring-LWR 实例。根式扩张的关键优势在于：公钥矩阵大小随 k 线性增长（而非 Module-LWR 中的二次增长），显著降低矩阵生成代价和存储需求。KEM 选取 n=128、k=5，工作在 640 维格上，在 MATZOV 精化攻击估计下提供约 153 位安全（高于 Kyber/Saber 同维数约 140 位的估计），以更保守的姿态换取更高的安全裕量。模数 q 为 2 的幂（KEM 取 q=2^13），采样分布为均匀分布（区间 [−α, α−1]），无拒绝采样、无高斯采样，便于侧信道掩码防护（算术到布尔转换在 2 的幂模数下更简单）。KEM 和签名共享实现模块（n=128 的乘法可作为 n=1024 乘法的子程序），支持 NTT、Toom-Cook、Karatsuba 等多种多项式乘法后端。与 ML-KEM 相比，Mithril-128 优化 AVX2 实现慢约 1.4 倍，Mithril-256 与 ML-KEM-1024 性能差距约 1.1 倍，安全裕量更大。","points":["根式环 Sq,n,k：Ring-LWR 与 Module-LWR 之间的中间结构，公钥矩阵随 k 线性增长（非二次）","KEM 参数：n=128, k=5, 格维度 640，约 153 位安全（MATZOV 精化，优于 Kyber/Saber）","模数 q=2^13（2 的幂），无拒绝采样，均匀分布采样，便于侧信道掩码实现","ARCANE 套件：与 Octarine 签名共享代数结构与实现模块，复用性强","具体公钥/密文字节尺寸（文件未提供/不明确）"],"level1":{"label":"Mithril-128","pk":944,"sk":1136,"sig":null,"ct":928,"source":"规范 Table 2 直接摘录（pk 944 / sk 1136 / ct 928 bytes） | 128 位参数摘录自规范（Table 2 (lines 973-975): Mithril-128 KEM secret key 1136 KEM public key 944 KEM ciphertext 928 (bytes); core-SVP classic）"},"spec_file":"kem_22_Mithril.txt","spec_chars":30424,"text_available":true,"id":"kem-mithril","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"Mito","catLabel":"密钥封装（KEM）","cat":"kem","family":"编码-拟二进综合征解码（Quasi-Dyadic Syndrome Decoding，QDSD）","assumption":"拟二进综合征解码（QDSD）困难问题，具体为 (2,ℓ)-DQDSD-P 和 (3,ℓ)-DQDSD-PT 两类变体。","summary":"Mito 是第一个原生基于拟二进（Quasi-Dyadic）代数结构构建的 IND-CCA 安全 KEM。工作分两层贡献：理论层面，建立了统一的代数框架——全投影正则方案（Fully Regular Scheme, FRS），证明拟循环方案（如 HQC）和拟二进方案均为同一代数结构的特例，并通过 Theorem 4.1.2 证明拟二进代数满足可证安全所需的可分解条件，从而严格建立了 QDSD 问题的安全基础；应用层面，利用拟二进结构的固有性质大幅降低解码所需处理的等效误差权重，提升解密效率，支持串联 Reed-Muller/Reed-Solomon 码和距离知情擦除解码策略以改善 DFR。Mito.KEM 由 Mito.PKE（IND-CPA）经 SFO 变换（FO 的一种变体）构造，IND-CCA 安全完整证明已提供。相比 HQC 的拟循环结构，拟二进结构在多项式乘法上计算开销更低，公钥也可进一步压缩。提供两套参数集（Mito1 和 Mito2）针对不同安全等级和效率需求。","points":["首个拟二进 KEM：完整归约到 (2,ℓ)-DQDSD-P 和 (3,ℓ)-DQDSD-PT 问题","统一 FRS 代数框架：证明拟循环（HQC）与拟二进是同一结构特例，拟二进满足可证安全条件","串联 RM + RS 码 + 距离知情擦除解码，改善 DFR；拟二进多项式乘法开销低于拟循环","经 SFO 变换（FO 变体）获得 IND-CCA；两套参数集 Mito1/Mito2","具体密钥/密文字节尺寸（文件已提及但摘要部分未展示具体数值，不明确）"],"level1":{"pk":3908,"sk":4052,"ct":5796,"label":"Mito1 (lambda=128)","source":"128 位参数摘录自规范（Table 3.8 (line 1841): Mito1 lambda=128 |ek|=3908 |dk|=4052 |ct|=5796 bandwidth=9704; primary variant of three 128-bit s）"},"spec_file":"kem_23_Mito.txt","spec_chars":50102,"text_available":true,"id":"kem-mito","status":"第一轮候选","first_seen":"2026-09-20","cls":"编码类"},{"name":"MORNING-Scabbard","catLabel":"密钥封装（KEM）","cat":"kem","family":"模块格-LWR（Module-LWR，2 的幂模数负循环环）","assumption":"模块舍入学习（Module-LWR，MLWR）困难问题。","summary":"Scabbard 是基于 MLWR 的 IND-CCA KEM，运行在商环 Rm,n = Zm[x]/(x^n+1) 上，其中模数 m 和环维度 n 均为 2 的幂。与 MLWE 类方案不同，MLWR 通过确定性舍入隐式引入随机性，无需显式噪声采样。秘密多项式向量由中心二项式分布（CBD）采样（SampleSecretCBD），公开矩阵由均匀分布生成（SampleMatrixUD）。消息编码采用 MinalB2 方案（基于 B2 格的消息嵌入）。构造路径：Scabbard.PKE（IND-CPA）经 KEM 封装和 FO 变换升级为 Scabbard.KEM（IND-CCA）。安全证明在随机预言机模型（ROM）和量子随机预言机模型（QROM）下均已形式化建立，并分析了加权原始攻击（Weighted Primal Attack）和加权对偶攻击（Weighted Dual Attack）两类主要格攻击路径，以及核心 SVP 难度（core-SVP）和超越 core-SVP 的估计。性能方面提供了参考实现（13th Gen Intel Core i7 基准）、AVX2 优化实现和 Cortex-M4 优化实现（含峰值栈使用报告），并讨论了前向保密性、密钥误用容忍性和多密钥攻击抵抗等附加安全属性。","points":["环 Rm,n = Zm[x]/(x^n+1)，m 和 n 均为 2 的幂；基于 MLWR，确定性舍入，无显式噪声采样","秘密由 CBD 采样；MinalB2 消息编码方案（基于 B2 格嵌入，文件未详述具体构造）","IND-CCA 证明覆盖 ROM 和 QROM；分析加权原始/对偶攻击及 core-SVP 硬度","提供参考/AVX2/Cortex-M4 三套实现，含峰值栈使用报告","具体参数集字节尺寸（文件已列出表格，但摘要截断；参数尺寸不明确）"],"level1":{"label":true,"pk":736,"sk":1056,"sig":null,"ct":760,"source":"Scabbard-128/NIST Level 1，来自规范Table 2：封装密钥=736, 解封装密钥=1056, 密文=760 | 128 位参数摘录自规范（Table 2 (line 806): Scabbard-128 encapsulation key 736 decapsulation key 1056 ciphertext 760 shared secret 16; all in by）"},"spec_file":"kem_24_MORNING-Scabbard.txt","spec_chars":49727,"text_available":true,"id":"kem-morning-scabbard","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"NEV","catLabel":"密钥封装（KEM）","cat":"kem","family":"环-NTRU 格（NTRU 密钥封装，结合 RLWE 辅助假设）","assumption":"NTRU 困难问题 + sspRLWE（Subset-Sum Parity RLWE，可证明不弱于标准 RLWE）的联合困难性，标准模型中可证。","summary":"NEV 是以 NTRU 加密为基础、通过全新明文编码和 NTT 友好环增强的 KEM 家族，核心方案 NEV-PKE-OW 即 Asiacrypt 2023 发表的 NEV' 方案。整个家族共五个方案：NEV-PKE-OW（OW 安全）、NEV-KEM-CPA、NEV-PKE-CPA、NEV-KEM-CCA、NEV-PKE-CCA，通过 Bellare-Rogaway 和 FO 变换逐步提升安全强度。安全性同时建立在 NTRU 和 sspRLWE 两个独立假设之上（sspRLWE 可证明不弱于标准 RLWE）。NEV-KEM-CCA 在 QROM 中实现 IND-CCA 安全，且无需采用其他后量子 KEM 常用的\"隐式拒绝\"策略，是在 QROM 下不依赖隐式拒绝的少数 NTRU 系方案之一。设计上刻意不使用纠错码（不同于 HQC 或 HARE），从而彻底规避了解密失败分析中通常需要的\"噪声独立性假设\"，使安全论证更为严格。参数集对应 128/256/512 位安全（DNTRUn,q 和 sspRLWEn,q,χ 两类问题参数化），使用 NTT 友好环进行高效实现，性能对标 Kyber 和 NTRU+。","points":["双重独立安全基础：NTRU + sspRLWE（sspRLWE ≥ RLWE 困难性），标准模型可证","QROM 下 IND-CCA 安全而无需隐式拒绝策略（区别于 Kyber 等主流方案）","刻意无纠错码，消除解密失败分析中的独立性假设，安全论证更严格","五方案完整谱系：OW → CPA KEM/PKE → CCA KEM/PKE；含 QROM 下完整证明","具体参数集字节尺寸（文件已有参数集表格，但截断，不明确）"],"level1":{"label":"NEV-R1 (128-bit 推荐)","pk":672,"sk":null,"sig":null,"ct":672,"source":"规范 Table 2 直接摘录；同组备选 NEV-C1 压缩版 (615, 512)、NEV-D1 (768, 768) | 128 位参数摘录自规范（Table 2 (line 1089): NEV-R1 n=512 q=1409 (B3,B3) (B3,B3) PK=672 CT=672 DFR=2^{-133}; recommended 128-bit set; sk not lis）"},"spec_file":"kem_25_NEV.txt","spec_chars":48349,"text_available":true,"id":"kem-nev","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"NSS-HQC","catLabel":"密钥封装（KEM）","cat":"kem","family":"编码-拟循环综合征解码（HQC 变体，加入哈明度量量化压缩）","assumption":"准循环综合征解码（DQCSD，Decisional Quasi-Cyclic Syndrome Decoding）困难问题，与 HQC 相同。","summary":"NSS-HQC 是 HQC 的带宽优化变体，将两项独立研究的优化技术整合到统一设计中：（1）**哈明度量量化密文压缩**：采用压缩映射（Compression Map）、解压缩映射和颤抖（Dithering）机制对密文进行量化，类比格密码中的 LWR 压缩思路，在二进制域对 HQC 密文实施；（2）**非对称误差权重再平衡**：通过调整公钥和密文中误差向量权重的不对称性，联合优化带宽与 DFR。统一的 DFR 分析框架（复合误差模型）支持两项技术的联合优化。消息编码使用串联码：内层为复制 Reed-Muller 码，外层为缩短 Reed-Solomon 码，外层解码引入基于可靠度的软判决（Reliability-Based Outer Decoding）进一步降低 DFR。与未量化的 NSS-HQC 基线相比，密文尺寸降低 16%–30%（四个安全等级均如此）。支持 128/256/384/512 位古典安全等级（量子安全分别至少 80/128/192/256 位），IND-CCA2 由 FO 变换建立，并提供含 ISD 代价验证的完整安全强度分析。","points":["双重优化：哈明度量量化密文压缩 + 非对称误差权重，统一 DFR 框架联合优化","密文尺寸比未量化基线降低 16%–30%（四个安全等级）","内层复制 RM 码 + 外层缩短 RS 码 + 基于可靠度的软判决外层解码（改善 DFR）","四个安全等级：128/256/384/512 位古典安全，量子安全 ≥80/128/192/256 位","安全基础同 HQC（DQCSD 假设）；IND-CCA2 经 FO；含 ISD 代价验证安全强度分析"],"level1":{"pk":3713,"sk":3777,"ct":5185,"label":"NSS-HQC-128","source":"128 位参数摘录自规范（Table 15 (line 2236): NSS-HQC-128 pk=3713 sk=3777 ciphertext=5185 K=32 bandwidth=8898; all in bytes）"},"spec_file":"kem_26_NSS-HQC.txt","spec_chars":48934,"text_available":true,"id":"kem-nss-hqc","status":"第一轮候选","first_seen":"2026-09-20","cls":"编码类"},{"name":"NTRE Key Encapsulation Mechanism","catLabel":"密钥封装（KEM）","cat":"kem","family":"环-NTRU 格","assumption":"NTRU 困难问题（基于多项式环上的密钥恢复难性）。","summary":"NTRE 是基于 NTRU 的 IND-CCA 安全 KEM，采用两层构造：底层 NTRE.CPAPKE 提供 OW-CPA 安全（一次性加密正确性保证），上层 NTRE.CCAKEM 经 PKE-to-KEM 变换实现选择密文安全。核心运算基于多项式环结构，涉及多项式采样、NTT 变换、基乘法（poly_basemul / poly_basemul_add）、模 2 归约解密（密文多项式与私钥多项式乘积后模 2 恢复消息），以及封装时哈希函数派生共享密钥并在解封装时验证密文合法性。提供三个参数集 NTRE-128、NTRE-256、NTRE-512，分别对应 128/256/512 位安全等级，并附有对应 KAT 向量文件（Test_Vectors/ 目录）。实现分为参考实现（C99, gcc -O2）和 AVX2 优化实现（gcc -O3 -mavx2 -flto），以 NTRU+ 为性能对标基线。优化热点集中在 poly_basemul_add、poly_basemul 等路径，KeyGen 路径优化效益最显著。","points":["两层构造：NTRE.CPAPKE（OW-CPA）+ NTRE.CCAKEM（IND-CCA，PKE-to-KEM 变换）","三个参数集：NTRE-128/256/512，覆盖 128/256/512 位安全等级，含 KAT 向量","参考实现（C99, gcc -O2）+ AVX2 优化实现（gcc -O3 -mavx2），对标 NTRU+ 基线","热点路径：NTT、poly_basemul_add；KeyGen 路径 AVX2 优化效果最显著","具体公钥/密文/共享密钥字节尺寸（文件记录了基准数据但摘要截断，不明确）"],"level1":{"pk":972,"sk":1976,"ct":972,"label":"NTRE-2593-648","source":"128 位参数摘录自规范（Table 4 (lines 1930-1932): NTRE-2593-648 sk=1976 pk=972 ct=972 (bytes); classical security 132 bits）"},"spec_file":"kem_27_NTRE_Key_Encapsulation_Mechanism.txt","spec_chars":27293,"text_available":true,"id":"kem-ntre-key-encapsulation-mecha","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"OAEP-NTRU","catLabel":"密钥封装（KEM）","cat":"kem","family":"环-NTRU 格（采用 OAEP† 变换，非 FO）","assumption":"NTRU 困难问题（通过 ATIF 实例化），结合随机预言机假设。","summary":"OAEP-NTRU 是基于新型 OAEP† 变换和 NTRU 格问题的后量子 KEM，设计理念与主流方案（如 Kyber、NTRU+）使用 FO 变换的范式根本不同。OAEP† 引入两个新型基础组件：**几乎陷门单射函数（ATIF）**和**半广义一次性垫（SOTP）**，允许非均匀前像分布，使 NTRU 的中心二项式秘密分布可以直接实例化，无需均匀分布约束。与 FO 相比，OAEP† 最显著的优点是解封装时**无需重加密验证**，消除了重加密引起的侧信道风险。安全性方面，除标准 IND-CCA 外，同时实现 **ANO-CCA**（匿名性）、**PR-CCA**（密文伪随机性）和 **ROB-CCA**（健壮性），是首个在 QROM 中同时达成匿名性和健壮性的 OAEP 变体。安全衰减仅 ε^{1/2}（优于 Q-OAEP 的 ε^{1/8}）。提供三个参数集：OAEP-NTRU-648、OAEP-NTRU-1296、OAEP-NTRU-2592（分别对应 128/256/512 位安全）。支持部分消息恢复模式（封装时可同时加密短消息，实现更紧凑密文）。解封装失败概率极低：坏密钥对概率至多 2^{−159}，其余密钥对解封装完全正确，提供比平均失败率更强的正确性保证。","points":["新型 OAEP† 变换：ATIF + SOTP，无需重加密，比 FO 更强侧信道防护","安全性：IND-CCA + ANO-CCA + PR-CCA + ROB-CCA，均在 QROM 中证明；安全衰减仅 ε^{1/2}","三个参数集：OAEP-NTRU-648/1296/2592，对应 128/256/512 位安全","解封装失败：至多 2^{−159} 概率出现\"坏密钥对\"，其余密钥对完全正确（优于平均失败率保证）","支持部分消息恢复模式（封装兼加密短消息，密文更紧凑）；使用 NTT 加速多项式运算"],"level1":{"label":true,"pk":1053,"sk":2138,"sig":null,"ct":1085,"source":"OAEP-NTRU-648，n=648,q=7129；plen=⌈log₂7129⌉·648/8=13·648/8=1053；pk=plen=1053；sk=2·plen+λ/4=2106+32=2138；ct=plen+σ=1053+32=1085，均为计算值 | 128 位参数摘录自规范（Table 4 (line 1350): OAEP-NTRU-648 |pk|=1053 |sk|=2138 |ct|=1085 |k|=32; size in bytes; classical security >=128 bits）"},"spec_file":"kem_28_OAEP-NTRU.txt","spec_chars":35103,"text_available":true,"id":"kem-oaep-ntru","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"Polar-KEM","catLabel":"密钥封装（KEM）","cat":"kem","family":"格同构问题（LIP）/ 极化格（Polar Lattice-LIP）","assumption":"基于极化格上的格同构问题（polar-LIP）及隐藏理想分解（HID）问题的困难性。","summary":"Polar-KEM 是一种基于格同构问题（LIP）的后量子 KEM，将 LIP 密码学蓝图与极化格（Construction D 从嵌套极化码构造）相结合，采用逐次消除（SC）译码器实现高效有界距离译码，从而将正确解密与 LIP 困难性清晰分离。该方案与同类 LIP-KEM 方案（如基于 Barnes-Wall 格或正交格者）的核心区别在于：极化格具有递归 Arikan 变换结构，SC 译码可高效执行，同时保留了 LIP 假设的安全性。关键创新包括：引入 polar-LIP 困难问题作为独立安全假设，以及通过随机提取器和 KDF 将格解码输出转化为密钥材料。IND-CCA2 安全性通过量子随机预言机模型（QROM）下的 Fujisaki-Okamoto（隐式拒绝）变换实现。方案与 HAWK（正交格 LIP 签名）存在家族关联，但用于 KEM 且底层格族不同。安全性分析涵盖 BKZ 格归约、BDD/Kannan 嵌入攻击、结构攻击和对偶格攻击。","points":["三套参数集：PolarKEM-128 / PolarKEM-256 / PolarKEM-512，分别对应 NIST 安全级别 1/3/5。","底层结构：极化格（非环形、非模块形），安全假设独立于 LWE/NTRU，是非主流 LIP 路线。","安全假设新颖（polar-LIP），同类方案研究积累较 LWE 少，攻击上界分析需更多支撑。","译码采用多级 SC 解码，计算复杂度 O(n log n)，比通用 CVP 求解高效。","公钥、私钥、密文尺寸数据文件中有描述但具体数值（lite 版）未完整列出；方案声称竞争力强于 Barnes-Wall LIP 基线。"],"level1":{"label":"PolarKEM-128","pk":1024,"sk":2048,"sig":null,"ct":768,"source":"规范 Table 6 直接摘录（pk 1024 / sk 2048 / ct 768 bytes） | 128 位参数摘录自规范（Table 6 (lines 1152-1154): PolarKEM-128 Public key 1024 Secret key 2048 Ciphertext 768 Shared secret 16; all in bytes）"},"spec_file":"kem_29_Polar-KEM.txt","spec_chars":41941,"text_available":true,"id":"kem-polar-kem","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"PolarLAC","catLabel":"密钥封装（KEM）","cat":"kem","family":"模块格-LWE（Module-LWE）+ 极化码纠错","assumption":"Module Learning with Errors（MLWE）问题的困难性。","summary":"PolarLAC 是 LAC（NIST 第 2 轮候选，基于环-LWE）的模块化改进版本，将底层结构升级为 Module-LWE，并以极化码替代 LAC 的纠错机制（原为 BCH 码）。核心创新有两点：一是利用信道极化分析 MLWE 噪声（将多项式卷积噪声建模为极化信道），以极化码的 SC 译码实现更优的纠错性能；二是引入\"频谱拒绝采样\"（Spectral Rejection Sampling），通过对封装随机向量 e·r 的 FFT 幅值设置阈值，防御针对 LAC 等方案的 DFR（解密失败率）攻击（即资源耗尽攻击）。解密失败率分析引入\"退化信道模型\"和对两类（Type-1/2）频谱攻击的精细讨论。实现上提供 SM3 和 SHAKE 两种哈希实例化，支持 C 参考实现及 AVX2/ARM SVE 优化版本。","points":["参数集：PolarLAC-128 等（文件中 Table 3 为 PolarLAC.KEM.CCA 参数集，具体数值 lite 版未完整显示）。","是 LAC 的模块化升级：LAC 为环-LWE，PolarLAC 为 Module-LWE，纠错从 BCH 码改为极化码。","频谱拒绝采样为关键防御机制：对已知 DFR 攻击（Type-S/频域攻击）具有明确的抵御能力分析。","多项式乘法采用（部分展开）NTT 结构，支持 AVX2 加速；另提供 ARM/SVE 实现。","同时提交 PKE（PolarLAC.PKE.CPA）和 KEM（PolarLAC.KEM.CCA）两个版本。"],"level1":{"label":"PolarLAC-128","pk":530,"sk":1570,"sig":null,"ct":640,"source":"规范 Table 3 直接摘录（pk 530 / sk 1570 / ct 640 bytes；core-SVP 132.5/122.6） | 128 位参数摘录自规范（Table 3 (line 1223): PolarLAC-128 k=2 n=256 q=257 pk=530 sk=1570 ct=640 DFR=2^{-146} core-SVP=132.5/122.6）"},"spec_file":"kem_30_PolarLAC.txt","spec_chars":58235,"text_available":true,"id":"kem-polarlac","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"QIMEN-PIKE","catLabel":"密钥封装（KEM）","cat":"kem","family":"同源密码（Supersingular Isogeny）/ 掩码环同源问题","assumption":"超奇异椭圆曲线上的掩码挠点同源问题（Masked Torsion Isogeny Problem）——给定曲线 E、E' 及被未知掩码矩阵 M∈Γ 遮盖的挠点像，求还原秘密同源 φ。","summary":"QIMEN-PIKE 是 QIMEN 密码套件中的 KEM 组件（签名组件为 QIMEN-PRISM），基于同源 ElGamal 型公钥加密方案 PIKE（PKC'26 录用），而 PIKE 本身建立在 POKÉ 之上。其核心架构为：接收方采样秘密同源 φ: E₀→E_A 作为私钥，发布 E_A 及 φ 在挠点上的掩码像；发送方采样临时平滑度同源 ψ: E₀→E_B，借助挠点信息构造 ψ': E_A→E_AB，形成交换图。共享密钥由 pairing 值导出，接收方利用秘密掩码信息通过一次二维同源计算完成配对，得到共享秘密。与 SIDH/SIKE 的关键区别：挠点像由未知矩阵 M 掩盖，已知的多项式时间 SIDH 攻击（Castryck-Decru、Robert 等）依赖裸挠点信息，对掩码变体不直接适用。数学实现涉及 1 维和 2 维同源（(2,2)-同源，θ 坐标）、配对（Weil/Tate 型）等高级数论工具。","points":["安全基础：掩码挠点同源问题，已知最佳攻击为指数级，无多项式攻击。","源自 M-SIDH/FESTA/QFESTA 同一范式，但架构为 ElGamal 型，而非 CSIDH 类或 Richelot 类。","实现涉及复杂的 2 维同源（(2,2)-同源）和投影 x-only 坐标，计算开销较大。","提供压缩（Compressed）和非压缩（Uncompressed）两种实现，公钥/密文尺寸随之不同。","具体参数集（文件第 5 章）在 lite 版中有限，安全级别与实际密文/公钥字节数（文件第 7 章）待完整规范确认。"],"level1":{"pk":641,"sk":724,"ct":800,"label":"NGCC-1","source":"128 位参数摘录自规范（Table 7.1 (line 2768): NGCC-1 (uncompressed) pk=641 sk=724 ct=800; compressed variant also listed (pk=405,sk=488,ct=602)）"},"spec_file":"kem_31_QIMEN-PIKE.txt","spec_chars":41742,"text_available":true,"id":"kem-qimen-pike","status":"第一轮候选","first_seen":"2026-09-20","cls":"同源类"},{"name":"Quasi-Cyclic Twisted McEliece Key Encapsulation Mechanism","catLabel":"密钥封装（KEM）","cat":"kem","family":"编码密码-准循环扭 Goppa 码（Quasi-Cyclic Twisted Goppa Code, Niederreiter 型）","assumption":"扭 Goppa 码的综合征译码（Syndrome Decoding）困难性及 Goppa 码结构不可区分性。","summary":"QCTM 采用 Niederreiter 型密钥封装框架，底层码族为带仿射平移参数 η 的准循环扭 Goppa 码 Γ(L, g, η)。相较经典 McEliece 公钥体积过大的问题，QCTM 引入混合系统型公钥矩阵：主体部分 T₁ 为 ℓ-分块循环矩阵（可压缩存储），尾行 T₂ 为普通二元矩阵（不压缩），从而在公钥压缩与安全性之间取得平衡——纯 QC-Goppa（如 BIKE）结构化过强存在潜在攻击风险，而 QCTM 仅对 T₁ 压缩，T₂ 保留全量信息以提升安全性。封装时采样固定重量错误向量 e，计算校验子 C=He^T，并从 (e, C) 派生会话密钥；解封装利用扭 Goppa 码译码算法（需域扩展运算）恢复 e，失败时使用私钥随机备用向量 s 输出伪随机密钥。","points":["三套参数集：QCTM128（pk: ~168 KB, sk: ~23 KB, ct: 640 B）；QCTM256（pk: ~595 KB, sk: ~44 KB, ct: 1,153 B）；QCTM512（pk: ~2.37 MB, sk: ~88 KB, ct: 2,264 B）。","公钥体积远大于格基方案，与经典 McEliece 同量级但有压缩，密文极小（百至千字节级）。","底层码参数（QCTM128）：m=18, n=10070, ℓ=19, t₀=15, t=285, k=4957, w=142。","安全分析涵盖 ISD（信息集译码）攻击和结构攻击，抗量子攻击分析亦包含在内。","提供参考实现和优化实现，含已知答案测试（KAT）。"],"level1":{"pk":167919,"sk":23299,"ct":640,"label":"QCTM128","source":"128 位参数摘录自规范（Lines 234-236: QCTM128 pk=167919 sk=23299 ct=640; code-based KEM targeting 128-bit security）"},"spec_file":"kem_32_Quasi-Cyclic_Twisted_McEliece_Key_Encapsulation_Mechanism.txt","spec_chars":25719,"text_available":true,"id":"kem-quasi-cyclic-twisted-mceliec","status":"第一轮候选","first_seen":"2026-09-20","cls":"编码类"},{"name":"QUBE","catLabel":"密钥封装（KEM）","cat":"kem","family":"编码密码-准循环综合征译码（Quasi-Cyclic Syndrome Decoding, QCSD）/ 多块非平衡误差","assumption":"带非平衡分块误差的准循环综合征译码（QCSD）问题的困难性。","summary":"QUBE（Quasi-Cyclic with Unbalanced & Multi-Block Errors）是 HQC 的扩展框架，在准循环码基础上引入多块（multi-block）技术和非平衡分块误差（unbalanced blockwise errors）。工作环为 R = F₂[X]/(X^r−1)，公私钥及密文基于准循环结构的校验子计算。核心创新：通过将加密向量按多块方式采样（各块 Hamming 重量可不同），在保持相同安全级别下显著压缩密文体积。与 HQC 相比，密文尺寸减少约 25%–30%，公钥+密文总量亦缩减 1.4%–5.6%。这在 KEMTLS 等场景（静态证书 KEM）中优势尤为突出。规范给出针对 QCSD 的 ISD 算法和量子 ISD 算法的攻击复杂度估计，以及对 HQC 的具体攻击分析（Section 3.4）。PKE→KEM 转换采用标准 FO 变换。","points":["四个安全级别：目标经典安全 128/256/384/512 位，对应量子安全 80/128/192/256 位。","密文尺寸较 HQC 压缩 25%–30%，是本方案最显著的性能优势。","基于 QCSD 困难性，与 HQC/BIKE 同一安全家族，但采用多块非平衡误差新变体。","在针对 HQC 的弱点分析部分（Section 3.4）提出了对 HQC 的具体攻击，展示差异化设计动机。","IND-CPA PKE + FO → IND-CCA2 KEM，实现了对标 HQC 的更紧凑设计。"],"level1":{"pk":3294,"sk":3326,"ct":3287,"label":"QUBE-128","source":"128 位参数摘录自规范（Table 5 (line 521): QUBE-128 sk=3326 pk=3294 ct=3287; all in bytes）"},"spec_file":"kem_33_QUBE.txt","spec_chars":43279,"text_available":true,"id":"kem-qube","status":"第一轮候选","first_seen":"2026-09-20","cls":"编码类"},{"name":"Rudraksh2","catLabel":"密钥封装（KEM）","cat":"kem","family":"模块格-LWE（Module-LWE，MLWE）","assumption":"Module Learning with Errors（MLWE）问题的困难性。","summary":"Rudraksh2 是专为资源受限设备设计的轻量级 MLWE-KEM，延续 Kyber 设计范式（IND-CPA PKE + 调整版 FO 变换→IND-CCA2 KEM），但在参数选择和实现上针对嵌入式场景优化。多项式环为 Z_q[x]/(x^n+1)，误差采用中心二项分布（CBD）采样。对称原语使用 XOF 实例化 G、H 和 PRF，支持 SM3 作为 XOF 的硬件实现方案。实现层面：提供 x86 AVX2 优化版、Cortex-M4 内存优化版（含栈内存分析），以及 FPGA 硬件架构（SM3 作为 XOF）。安全分析包括原始攻击、对偶攻击、Core-SVP 和超 Core-SVP 硬度、DFR 攻击，并讨论完美前向保密、侧信道弹性、多密钥攻击弹性和密钥误用弹性等额外安全属性。","points":["底层为 MLWE，与 Kyber 同家族，轻量化改进版本，具体参数集（lite 版）未完整显示。","显式针对资源受限设备（IoT/嵌入式）：Cortex-M4 内存优化，FPGA 硬件设计方案。","使用 CBD 误差采样（无拒绝采样），同 Kyber，简化实现。","SM3 可作为 XOF 的硬件实例化，对国内密码标准体系友好。","安全证明同时覆盖经典随机预言机模型和量子随机预言机模型（QROM）的 IND-CCA 安全性。"],"level1":{"label":"Rudraksh2-128-I","pk":880,"sk":1776,"sig":null,"ct":912,"source":"规范 Table 2 表格直接摘录（Public key 880 / Secret key 1776 / Ciphertext 912 / ss 16 bytes） | 128 位参数摘录自规范（Table 2 (line 812): Rudraksh2-128-I pk=880 sk=1776 ct=912; all in bytes）"},"spec_file":"kem_34_Rudraksh2.txt","spec_chars":56782,"text_available":true,"id":"kem-rudraksh2","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"Scloud+","catLabel":"密钥封装（KEM）","cat":"kem","family":"无结构 LWE（Plain/Unstructured LWE）+ Barnes-Wall 格码纠错","assumption":"标准 Learning with Errors（LWE）问题的困难性（无代数环结构）。","summary":"Scloud+ 是国产竞赛方案 Scloud 的升级版，定位为类 FrodoKEM 的无结构 LWE-KEM。与结构化 LWE 方案（Kyber、LAC、Saber）不同，Scloud+ 直接基于标准 LWE，不引入环/模块代数结构，从而规避代数结构可能带来的安全风险。两项核心改进：①将 Scloud 的格码升级为基于 Barnes-Wall 格（RBW_d）的高效格编码，显著提升纠错能力，降低解密失败率；②采用三值（ternary）秘密分布，缩减密钥和密文尺寸并提升运行速度。LWE 矩阵为无结构随机矩阵，通过 AES/SHAKE/SM3 生成伪随机扩展，支持三种对称原语实例化。构造路线为 PKE（Scloud+.PKE）+ FO 隐式拒绝变换→KEM（Scloud+.KEM）。安全分析包含原始/对偶格归约攻击及具体硬度估计。","points":["无结构 LWE 设计，类 FrodoKEM 路线，安全性不依赖环或模块结构。","Barnes-Wall 格码（RBWd）纠错是关键创新，兼顾 DFR 控制与带宽效率。","三值秘密（ternary secret）减小噪声规模，改善密钥/密文尺寸。","参数集覆盖 128/256/384/512 位安全级别，后两者为 Scloud+ 新增。","三种对称原语（AES/SHAKE/SM3）的参考及优化实现均有提供，支持多平台部署。"],"level1":{"label":"Scloud+.KEM-128","pk":6096,"sk":null,"sig":null,"ct":6160,"source":"规范 Table 4 直接摘录（pk 6096 / ct 6160 bytes，ss 16） | 128 位参数摘录自规范（Table 4 (line 679): Scloud+.KEM-128 Public key pk=6096 Ciphertext C=6160 ss=16; table has no sk column）"},"spec_file":"kem_35_Scloud_.txt","spec_chars":58565,"text_available":true,"id":"kem-scloud","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"TRIKE","catLabel":"密钥封装（KEM）","cat":"kem","family":"编码密码-三重准循环码（Triple Quasi-Cyclic Code，QCSD 变体）","assumption":"准循环综合征译码（QCSD）问题及比率准循环码字查找（RQCCF）问题的困难性；RQCCF 可归约到三元 QCCF（3-QCCF）。","summary":"TRIKE（Triple Quasi-Cyclic Code KEM）是基于三重准循环框架的编码 KEM，核心思想是用除法操作（\"比率\"机制）隐藏稀疏秘密结构，从而将安全性归约到 RQCCF 问题——这是一个比标准 SD/QCSD 更具有结构保护的新变体。与 HQC 和 BIKE 的关系：TRIKE 概念上承袭二者，但通过比率机制掩盖秘密，使其相比 BIKE（无明确 DFR 保证、易受弱密钥攻击）更安全，同时实现与 HQC 相近但带宽缩减约 40% 的效果。另一关键设计是弱密钥拒绝（Weak Key Rejection），采用精确的 FLS（有限长度分析）DFR 模型识别并拒绝三类（Type I/II/III）弱密钥，将其对整体 DFR 的贡献降至可忽略水平。相比 BIKE 译码时间约降低 50%。","points":["安全假设：QCSD + RQCCF（新问题），RQCCF 可归约到 3-QCCF，与标准 SD 问题有明确关联。","相比 HQC 带宽减少约 40%，相比 BIKE 译码时间减少约 50%。","三重准循环结构将公钥规模从 O(n²) 降至 O(n)。","弱密钥拒绝策略（三类弱密钥，Gathering Property），是 DFR 安全性的重要保障。","PKE + FO 隐式拒绝变换→IND-CCA2 KEM；具体参数集在 lite 版中未完整列出。"],"level1":{"pk":1304,"sk":4220,"ct":2592,"label":"TRIKE-1","source":"128 位参数摘录自规范（Table 3 (line 610): TRIKE-1 sk=4220 pk=1304 ct=2592; Level 1 targets 128-bit classical security）"},"spec_file":"kem_36_TRIKE.txt","spec_chars":50246,"text_available":true,"id":"kem-trike","status":"第一轮候选","first_seen":"2026-09-20","cls":"编码类"},{"name":"TriQ-KEM","catLabel":"密钥封装（KEM）","cat":"kem","family":"编码密码-约束重量准循环综合征译码（Constrained-Weight QCSD，CW-QCSD）","assumption":"约束重量准循环综合征译码（CW-QCSD）假设的困难性。","summary":"TriQ-KEM 通过对 TriQ-PKE（IND-CPA）施以 FO 变换得到 IND-CCA2 安全的 KEM。TriQ-PKE 在 HQC 框架基础上引入三项关键改进：①加密向量 r₁、r₂、e 采用非平衡权重（unbalanced weights），破坏 HQC 均衡假设，改善 DFR 与带宽权衡；②公开的有界密度拒绝采样（Bounded-Density Rejection Sampling），确保加密向量密度在安全范围内，抵御利用 DFR 的攻击；③攻击感知的 DFR 评估——引入密度区间累积 DFR（CDFR）指标，对 ISD（信息集译码）攻击路径下的 DFR 进行精细建模。内部码结构使用 Reed-Muller（RM）和旋转 Simplex Reed-Muller（RSRM）码。安全性分析含结构化 ISD 对非平衡 QCSD 的影响评估，并附 HQC 参数对比基准。","points":["安全假设为 CW-QCSD，是 QCSD 在约束权重下的变体，比 HQC 标准 QCSD 更保守。","非平衡误差权重：r₁、r₂、e 权重可不同，打破 HQC 对称假设，改善 DFR/带宽平衡。","有界密度拒绝采样：对加密向量密度施加上下界，防御密度相关 DFR 攻击，类似 PolarLAC 的频谱拒绝采样。","提供 KAT（已知答案测试）和详细实现性能报告，附 HQC 对比基准（附录 C）。","具体参数集（lite 版）中有 IV-B 节描述，公私钥/密文尺寸在 IV-C 节给出（具体数值文件截断，未完整显示）。"],"level1":{"pk":2054,"sk":2102,"ct":4086,"label":"TriQ-KEM-128","source":"128 位参数摘录自规范（Table 5 (line 650): TriQ-KEM-128 ekKEM=2054 dkKEM=2102 ct=4086; all in bytes）"},"spec_file":"kem_37_TriQ-KEM.txt","spec_chars":3426,"text_available":false,"id":"kem-triq-kem","status":"第一轮候选","first_seen":"2026-09-20","cls":"编码类"},{"name":"UVW Key Encapsulation Mechanism","catLabel":"密钥封装（KEM）","cat":"kem","family":"编码密码-Reed-Solomon 码列表译码（Code-based, RS List Decoding）","assumption":"基于 Reed-Solomon 码的综合征译码困难性及相关编码困难问题。","summary":"UVW KEM 以 Reed-Solomon（RS）码及其列表译码算法为核心工具构建公钥加密和密钥封装机制，采用与 McEliece/Niederreiter 不同的编码路线。方案分为 UVW 公钥加密方案（UVW PKE）和 UVW 密钥封装机制（UVW KEM）两部分。RS 码因其强大的纠错能力（与码长近线性的最小距离）和高效的列表译码算法（如 Guruswami-Sudan 算法）被选为底层纠错结构。安全分析区分经典安全强度和量子安全强度两类，给出具体安全强度估计。方案文件（lite 版）较短（61 行），仅包含目录和框架描述，具体参数和性能数据未完整呈现。","points":["底层代数工具为 Reed-Solomon 码 + 列表译码，与 McEliece（Goppa 码）路线不同。","提供 PKE（UVW.PKE）和 KEM（UVW.KEM）两个层次的构造。","安全分析同时给出经典和量子安全强度（具体数值文件未完整显示）。","方案参数（lite 版截断）：具体参数集、公钥/密文尺寸未完整列出（文件未提供/不明确）。","RS 码列表译码路线在 PQC 中较非主流，与 HQC/McEliece 主流编码方案有本质区别。"],"level1":{"pk":208013,"sk":35,"ct":1032,"label":"UVW128","source":"128 位参数摘录自规范（Table 2 (line 1554): UVW128 pk=208013 sk=35 ct=1032; all in bytes）"},"spec_file":"kem_38_UVW_Key_Encapsulation_Mechanism.txt","spec_chars":1814,"text_available":false,"id":"kem-uvw-key-encapsulation-mechan","status":"第一轮候选","first_seen":"2026-09-20","cls":"编码类"},{"name":"Weaver","catLabel":"密钥封装（KEM）","cat":"kem","family":"模块格-LWR（Module Learning With Rounding）/ Shifted-MLWR（新变体）","assumption":"Shifted-MLWR（移位模块舍入学习）问题的困难性，辅以 MLWE 归约。","summary":"Weaver 针对 Kyber（ML-KEM）在保守 Core-SVP 模型下的安全边际收窄问题（Kyber-512 经典安全仅约 115-118 位），提出了一种兼顾带宽、速度和安全冗余的模块 LWR-KEM。两项核心创新：①引入\"分层多层次编码\"——BCH 码与 4 倍重复码的层次组合，将更多消息比特打包进高度压缩的密文空间，同时保证强纠错能力；②提出 Shifted-MLWR 问题和随机提升（Randomized Lifting）技术，解决素数模与 LWR 安全归约之间的不兼容问题，使 Weaver 能够在\"嵌入再舍入\"密文结构下使用高度优化的 NTT 友好素数模运算。公钥均匀性通过 Randomized Lifting 保证。与 Kyber 相比，Weaver 在相同或更高安全冗余下提供更紧凑的密文和更快的多项式运算。","points":["安全假设：Shifted-MLWR（新提出变体），并给出向 MLWE/MLWR 的归约定理（附录 A）。","采用素数模+NTT 友好设计，通过随机提升解决素数模与 LWR 归约不兼容问题。","BCH + 4 倍重复码分层纠错框架，是提升安全冗余的核心技术手段。","明确回应了 Kyber-512 在保守 Core-SVP 模型下低于 128 位经典安全的问题，以更大安全冗余为设计目标。","参数集（Section 2.5）和公钥/密文/性能（Section 5）在 lite 版中有描述，具体数值未完整显示；提供 AVX2 优化和嵌入式平台（Cortex-M 等）评测。"],"level1":{"label":"Weaver-640","pk":752,"sk":null,"sig":null,"ct":816,"source":"规范 Table 4 直接摘录（|pk| 752 / |ct| 816 bytes，Classical 153-bit） | 128 位参数摘录自规范（Table 4 (line 894): Weaver-640 Classical=153 Quantum=137 |pk|=752 |ct|=816; sk not listed in table）"},"spec_file":"kem_39_Weaver.txt","spec_chars":56085,"text_available":true,"id":"kem-weaver","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"YuanYang.KEM","catLabel":"密钥封装（KEM）","cat":"kem","family":"NTRU 格（Ring-NTRU，基于幂次分圆环）","assumption":"NTRU 假设（NTRU 格上的短向量问题）及 Ring-LWE 假设的联合困难性。","summary":"YuanYang.KEM 是 NTRU 加密范式下的后量子 KEM，其最显著特性是与配套签名方案 YuanYang.DSA 共享同一密钥对——无需修改算法或参数，一对 YuanYang.DSA 密钥对即可直接用于 KEM 封装/解封装。此特性对支付卡、端对端加密消息等需要同一密钥兼顾认证与加密的场景极具价值。安全设计上，YuanYang.KEM 采用\"密\"秘密系数（dense secret），主动规避小秘密攻击（如 Howgrave-Graham 攻击）；将 NTRU 掩码模数设为小多项式 p=1+X^{d/2}（系数范数为 2），降低噪声放大倍数；并引入轻量级溢出修正步骤降低解密失败率。基于近似高斯采样生成密钥，安全性在保守 Core-SVP 模型下通过 NTRU 攻击、RLWE 攻击的具体复杂度分析验证。","points":["最大创新：KEM 与 DSA 密钥共享，同一密钥对同时支持 YuanYang.KEM 和 YuanYang.DSA。","密秘密（dense secret/randomness），抵御小秘密攻击，与 NTRU-HPS/HRSS 的稀疏秘密设计有别。","掩码模数 p=1+X^{d/2}（NTRU 零因子多项式），降低噪声放大并节省消息空间（参考 DAWN/NEV 路线）。","安全性在保守 Core-SVP 模型下满足目标级别，DFR 低于目标界。","公钥和密文尺寸\"可与 Kyber 媲美或更小\"（声称），具体数值（lite 版）未完整显示。"],"level1":{"label":"YuanYang.KEM-512 (128-bit)","pk":736,"sk":null,"sig":null,"ct":656,"source":"规范 Table 4 直接摘录（pk 736 / CT 656 bytes；表 1 中 128 位目标对应环次数 d=512） | 128 位参数摘录自规范（Table 4 (line 1151): YuanYang.KEM-512 pk size=736 CT size=656 (Bytes); sk not listed in performance table）"},"spec_file":"kem_40_YuanYang.KEM.txt","spec_chars":56905,"text_available":true,"id":"kem-yuanyang-kem","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"ZEN","catLabel":"密钥封装（KEM）","cat":"kem","family":"NTRU 格（Ring-NTRU，幂次分圆环）/ DAWN 衍生方案","assumption":"NTRU 格假设（短向量求解）的困难性。","summary":"ZEN 是 DAWN 的改进衍生方案，保留其零因子编码（x^{n/2}+1 和 x^{n/4}+1）和双重编码框架，在此基础上进行三层改进：①将解密模块的 DFR 分析从启发式改为基于群论的严格分析（Group-based DFR），使 DFR 估计具有理论保障；②所选参数行支持直接从随机比特采样系数，简化实现；③实现为常数时间，包含优化的多项式求逆过程，并覆盖 x86/AVX2、ARM Cortex-M3/M4/v7/v8 及 FPGA 多平台。ZEN 的优势在于结合 NTRU 单环元素密文的天然紧凑性（优于双分量 Ring-LWE 密文）和零因子双重编码的高效消息容量（消息空间 2^{n/2}，噪声放大系数 √2），实现在给定安全级别下极致的尺寸和速度。局限：幂次分圆环结构导致 192 位和 384 位安全级别难以自然参数化。","points":["源自 DAWN，核心区别：DFR 分析从启发式→严格群论分析；算法简化；实现规范化。","目标安全级别对：(128,80)、(256,128)、(512,256)（经典/量子），不支持 192/384 位。","零因子多项式编码（x^{n/2}+1, x^{n/4}+1）双层架构，消息空间 2^{n/2}，噪声放大 √2。","多平台优化实现：x86/AVX2、ARM M3/M4/v7/v8、FPGA；常数时间设计。","NTRU 天然单密文元素优势，密文尺寸理论上优于同安全级别 Ring-LWE/Module-LWE 方案。"],"level1":{"label":"ZEN-128","pk":615,"sk":null,"sig":null,"ct":512,"source":"规范 Table 3 直接摘录（PK 615 / CT 512 bytes；CoreSVP 128） | 128 位参数摘录自规范（Table 3 (line 1301): ZEN-128 n=512 compression=769->256 PK=615 CT=512 CoreSVP=128 DFR=-128; sk not listed）"},"spec_file":"kem_41_ZEN.txt","spec_chars":35936,"text_available":true,"id":"kem-zen","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"ADKEX (Authenticated Ding Key Exchange)","catLabel":"密钥交换（KEX）","cat":"kex","family":"模块格-LWE（Module-LWE）/ Ding 调协机制 + 认证密钥交换","assumption":"Module Learning with Errors（MLWE）问题的困难性，以及基于 MLWE 的 DKEM 的 IND-CCA 安全性。","summary":"ADKEX 是将 Ding Key Exchange（DKE）迁移至模块格（Module Lattice）设定下的认证密钥交换（AKE）协议。DKE 原为向量空间 Z_q^n 上的基于调协机制的密钥交换，ADKEX 将其提升至模块 R_q^k（类 ML-KEM 设计哲学），从而构造出中间 KEM 原语 DKEM（Ding Key Encapsulation Mechanism），再以 DKEM 为基础构建两轮单边认证 AKE 协议。协议结构：响应方 B 持有长期认证 KEM 密钥对，发起方 A 生成临时 KEM 密钥对；A 发送临时公钥 M₁ 及对 B 长期公钥的 DKEM 密文，B 解封后对 A 的临时公钥封装，双方通过 KDF(sse ∥ sss ∥ T) 派生会话密钥（T 为含公钥、密文、标签的公开转录哈希）。协议在 Canetti-Krawczyk（CK）模型下提供弱完美前向保密（wPFS）。","points":["类型：认证密钥交换（AKE），非标准 KEM——是两轮单边认证协议，响应方被认证。","底层 DKEM 基于 Module-LWE，算法设计与 ML-KEM 对齐，复用 NTT/压缩等组件。","调协机制（Reconciliation）：继承 Ding 方案思想，在模块格设定下精细化重构（噪声界、模数选择等）。","安全模型：CK 模型，提供 wPFS；安全性依赖 DKEM 的 IND-CCA 安全性及解封装正确性。","DKEM 作为独立方案同步提交至 NGCC，ADKEX 依赖 DKEM 作为子组件构建 AKE 层。"],"level1":{"pk":800,"sk":1600,"ct":800,"label":"ADKEX-128","source":"128 位参数摘录自规范（Table 1 (line 1054): ADKEX-128 PKBITS/8=800 SKBITS/8=1600 CTBITS/8=800; long-term keys are DKEM-128 pk/sk; all in bytes）"},"spec_file":"kex_01_ADKEX_Authenticated_Ding_Key_Exchange_.txt","spec_chars":36205,"text_available":true,"id":"kex-adkex-authenticated-ding-key","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"AFS-KEX","catLabel":"密钥交换（KEX）","cat":"kex","family":"模块格-LWE（Module-LWE / MLWE）","assumption":"模块学习错误问题（MLWE），在随机预言机模型（ROM）和量子随机预言机模型（QROM）下可规约。","summary":"AFS-KEX 提交了两个基于 KEM 的后量子认证密钥交换协议：pMAKE-BW（两方相互认证）和 pUAKE-BW（单方认证）。其核心创新在于引入\"认证前向安全 KEM\"（AFS-KEM）抽象：在标准 KEM 语义之上叠加对等方公钥的绑定，使得 KEM 本身携带认证性，从而无需额外的数字签名即可完成身份认证，显著降低通信和计算开销。底层密码学原语为 BW-KEM（AFS-KEM 的一个 Module-LWE 实例化），协议安全性在扩展的 post-eCK-PFS 模型下形式化证明，同时支持完美前向保密（PFS）。规范同时给出了 CPA 安全 AFS-PKE 到 CCA 安全 AFS-KEM 的通用转换框架。实现涵盖参考实现、AVX2 优化版本以及 ARM Cortex-M4 移植。与同类方案（如 FSXY 系列、KEMTLS、PQ WireGuard、PQ IKE）相比，AFS-KEX 将认证整合进 KEM 内部，避免了 ML-DSA 级别的签名开销，与 ML-KEM 生态系统共享代数框架。","points":["两个协议变体：pMAKE-BW（两消息相互认证 AKE）和 pUAKE-BW（两消息单向认证 AKE）；","安全模型为 post-eCK-PFS，同时支持 ROM 和 QROM 安全证明；","无需签名的 KEM-only 认证设计，与 ML-KEM 共享 Module-LWE 假设；","提供参考实现、AVX2 优化实现及 ARM Cortex-M4 基准测试；","提出\"AFS-KEM\"为独立密码学原语，具有通用构造框架（CPA-AFS-PKE → CCA-AFS-KEM）。"],"level1":{"pk":1568,"sk":3170,"ct":768,"label":"AFS-KEX-C128","source":"128 位参数摘录自规范（Table 6 (line 1678): AFS-KEX-C128 Pub.key=1568 Sec.key=3170 Pass-1=768 Pass-2=784 Total msg=1568 ss=16; all in bytes）"},"spec_file":"kex_02_AFS-KEX.txt","spec_chars":78942,"text_available":true,"id":"kex-afs-kex","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"CreTAKE","catLabel":"密钥交换（KEX）","cat":"kex","family":"模块格-LWE / 环格（实例化层使用 PolarLAC、ZEN 作为 KEM，BiT 作为签名）","assumption":"底层 KEM 的 IND-CCA 安全性与底层签名的 EUF-CMA 安全性（具体依赖 MLWE/NTRU 等各组件的困难假设）。","summary":"CreTAKE 解决了后量子迁移过渡期中通信双方持有不同类型长期凭证（KEM 凭证 vs. 签名凭证）时的两消息 AKE 统一框架问题。方案分两层设计：框架层定义了四种 AKE 框架——异构凭证的 CreTAKE-K2S（发起方 KEM 凭证、响应方签名凭证）和 CreTAKE-S2K（反向），以及同构凭证的 CreTAKE-K2K（双 KEM）和 CreTAKE-S2S（双签名）；实例化层将 PolarLAC、ZEN（两个 KEM 族）和 BiT（签名）在 128/256/512 位安全级别下组合，给出 25 个具体实例。K2K 框架引入双密钥 KEM（2KEM）抽象，支持通用路径（独立密文）和紧凑路径（利用代数结构共享密文分量）。S2S 框架通过将发起方临时密钥派生自其签名密钥和新鲜随机数，实现了两消息完成双向签名认证。四个框架共享同一接口，在 QROM 下分别实现 IND-AA 或 IND-StAA 安全性。","points":["完整覆盖四种有序长期凭证组合（K2S、S2K、K2K、S2S），共享 (KG, Init, Derresp, Derinit) 接口；","实例化层使用 PolarLAC、ZEN（KEM）和 BiT（签名），三个安全级别共 25 个实例；","K2K 框架中 2KEM 抽象统一通用双密钥构造与结构感知紧凑构造；","所有框架均提供 QROM 下的形式化安全证明（IND-AA 或 IND-StAA）；","提供参考实现与 AVX2 优化实现及性能对比。"],"level1":{"pk":530,"sk":1570,"ct":640,"label":"K2K-PolarLAC-128","source":"128 位参数摘录自规范（Table 6 (line 1657): K2K-PolarLAC-128 I:BW=1170 R:BW=1280; K2K uses PolarLAC-128 long-term keys pk=530 sk=1570 ct=640）"},"spec_file":"kex_03_CreTAKE.txt","spec_chars":52213,"text_available":true,"id":"kex-cretake","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"DKEX (Ding Key Exchange)","catLabel":"密钥交换（KEX）","cat":"kex","family":"模块格-LWE（Module-LWE），配合签名认证层","assumption":"模块学习错误问题（MLWE），签名认证部分依赖相应后量子签名的 EUF-CMA 安全性。","summary":"DKEX 将经典 Ding 密钥交换的协商-调和思想移植到现代模块格框架中，解决了\"如何在 ML-KEM/ML-DSA 生态系统内构造基于调和机制的交互式 AKE\"问题。底层无认证密钥交换 DKE 使用结构化 Module-LWE 矩阵 A ∈ R_q^{k×k}（与 ML-KEM 风格相同），双方分别计算含噪的模块乘积，再通过改进的调和机制（Reconciliation）从近似相等的值中提取相同密钥比特，克服 LWE 噪声带来的不一致性。在 DKE 基础上叠加签名认证层构成 DKEX，签名对交换的临时值进行认证，会话密钥通过 KDF 与转录本绑定。安全性在 CK 模型下形式化，具备弱完美前向保密（wPFS）。规范分析了针对 MLWE 的攻击（lattice 攻击、量子安全估计）、调和失败概率以及对称原语攻击，给出具体参数集。","points":["模块格 Ding 型调和机制，工作在 R_q^{k×k} 模块结构上，继承 ML-KEM 紧凑性与高效算术；","改进的调和机制：从不完全相等的模块值中可靠提取共享密钥，并进行失败概率分析；","安全模型为 CK with wPFS，签名认证层使公开转录本与身份绑定；","参数设计与 ML-KEM/ML-DSA 生态兼容；","分析涵盖精细化 gate-count 估计与量子安全评估（文件未提供具体参数数值）。"],"level1":{"pk":1312,"sk":2560,"ct":800,"label":"DKEX-128","source":"128 位参数摘录自规范（Table 3 (line 1047): DKEX-128 ML-DSA-44 signing pk=1312 sk=2560 sig=2420; Table 5 (line 1056): Message 1=800; all in byt）"},"spec_file":"kex_04_DKEX_Ding_Key_Exchange_.txt","spec_chars":41274,"text_available":true,"id":"kex-dkex-ding-key-exchange","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"Loom","catLabel":"密钥交换（KEX）","cat":"kex","family":"模块格-LWE / 环格（KEM 组件）+ 签名认证（Shuttle 签名）","assumption":"模块 / 环 LWE 假设（Loom-KEM 的 IND-CPAF 安全性），以及 Shuttle 签名的 EUF-CMA 安全性。","summary":"Loom 专为 UDP/IKEv2 等对包大小敏感的网络协议设计，核心创新是\"允许非零但可显式检测的解密失败率（DFR）\"——与 Fujisaki-Okamoto 变换要求可忽略失败率不同，Loom-KEM 基于 IND-CPAF（含失败的选择明文不可区分性）和\"解封装刚性\"（rigidity，保证失败时输出显式错误符号而非错误密钥），从而可安全省去 FO 变换中的重加密步骤，大幅提升解封装效率并缩小密文尺寸。Loom 采用 Sign-and-MAC 架构：临时密钥交换由 Loom-KEM 完成，长期身份认证由 Shuttle 签名完成，两者解耦。该设计带来三项系统优势：(1) 首轮未认证报文严格低于 IPv6 MTU（1280 字节），原生对抗 IP 重组缓冲区 DoS；(2) 使用 X.509 兼容的签名凭证，无需迁移至 KEM 证书；(3) 长期签名密钥与密钥派生完全隔离，实现健壮 PFS。安全性在 post-specified-peer CK 模型下形式化证明。","points":["首创\"IND-CPAF + 刚性\"安全定义，允许小且可检测的 DFR，省去 FO 重加密步骤；","Sign-and-MAC 架构：Loom-KEM（紧凑格 KEM）+ Shuttle（签名），长期密钥与会话密钥派生完全隔离；","首轮载荷严格低于 IPv6 MTU 1280 字节，消除 IP 分片重组 DoS 攻击面；","安全模型为 post-specified-peer Canetti-Krawczyk（CK）模型；","提供 x86 参考实现与 AVX2 优化实现及传输/存储开销分析。"],"level1":{"pk":752,"sk":960,"ct":736,"label":"AKE-128 (Loom-KEM-128)","source":"128 位参数摘录自规范（Table 4 (line 870): AKE-128 KEM-128 |ek|=752 |ct|=736; Algorithm 7 (line 453): dk in B^{12*k*n/8}=12*5*128/8=960B）"},"spec_file":"kex_05_Loom.txt","spec_chars":58654,"text_available":true,"id":"kex-loom","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"MAMBA-NIKE","catLabel":"密钥交换（KEX）","cat":"kex","family":"环格（Ring-LWE/RLWQ-Z），非交互式密钥交换（NIKE）","assumption":"环带量化学习问题（Ring Learning with Quantization over Z，RLWQ-Z），通过正规形代理可规约到标准 RLWE 困难问题。","summary":"MAMBA-NIKE 是一种基于环结构的单程非交互式密钥交换方案，公钥分发后只需发起方在线发送一条消息 M₁=(µ, u, h)，双方即可独立派生相同共享秘密。其核心区别于 NewHope：(1) 模数选 q=2¹³（2的幂次）而非素数，系数约简退化为掩码操作，但不能用标准 NTT，改以系数域 Toom-Cook-4 卷积实现多项式乘法；(2) 噪声源换为\"公开抖动量化\"（dithered quantization），公开的 dither 在量化前加入再在重建时减去，产生与输入无关的量化误差，取代显式 CBD 误差采样；(3) 量化是一等密码学原语而非辅助压缩步骤，传输的 split label 即量化输出，安全规约经由重建正规形 RLWE 代理进行。D4 调和层将两个近似相等的环乘积转换为共享原始调和字符串，再由 SHAKE256 KDF 绑定转录本。提供 5 个参数档：128/192/256/384/512 位经典安全。被动实-随机密钥交换安全，明确不声称主动/CCA 类安全。","points":["环 R_q = Z_q[X]/(X^n+1)，q=2¹³，n∈{1024, 2048}，5 个安全档（128–512 位经典安全）；","一消息在线 NIKE，公钥预分发后无需交互；","公开抖动量化替代显式 CBD 误差，系数约简为无分支掩码操作；","多项式乘法用 Toom-Cook-4（不用 NTT），x86-64 优化版使用 AVX2 乘法器；","仅声明被动实-随机安全，不提供主动/CCA 安全保证。"],"level1":{"label":"MAMBA-NIKE-128","pk":1184,"sk":3232,"sig":null,"ct":1568,"source":"来自规范 Table 4 直接摘录（p-packed 外部字节长度）；ct 对应 M1 单次在线消息；|sk|_API=2n+|pk|=2×1024+1184=3232（含缓存公钥）；ss=32 bytes | 128 位参数摘录自规范（Table 2 (line 166): MAMBA-NIKE-128 |pk|=1184 |M1|=1568 |sk|API=3232 MATZOV(C)=272.1; all in bytes）"},"spec_file":"kex_06_MAMBA-NIKE.txt","spec_chars":54640,"text_available":true,"id":"kex-mamba-nike","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"NEV-AKE","catLabel":"密钥交换（KEX）","cat":"kex","family":"NTRU 格 + 环 LWE（Ring-LWE，具体为 sspRLWE 子假设）","assumption":"NTRU 困难问题 + 子集和奇偶性环学习错误问题（sspRLWE），后者与标准 RLWE 在适当参数下等价困难。","summary":"NEV-AKE 先提出通用 AKE 构造 GC-AKE，再以 NEV 系列 OW-CPA 安全原语实例化。通用构造以 OW-CPA 安全的 PKE 和 KEM 为核心模块，在 CK+ 模型下于 ROM 和 QROM 中均可证安全，计算效率略优于同类通用构造。具体实例化使用 NEV-PKE-OW 和 NEV-KEM-OW：两者均仅含单个环元素的公钥和密文，128 位经典安全下公钥和密文各约 670 字节，无需压缩技术（规避专利风险）也无需 LWR 假设。关键创新之一是在解密失败分析中彻底避免\"独立性假设\"（即不假设噪声分量相互独立），而是通过设计故意降低独立性对结论的影响，从而获得严格的失败概率保证。协议为两轮设计，提供完整的参数集及侧信道攻击分析（含掩码抗泄漏方案）。","points":["安全假设组合：NTRU + sspRLWE（实质难度等价于标准 RLWE）；","通用框架 GC-AKE：仅需 OW-CPA 安全 PKE + KEM，在 ROM/QROM 下均可证安全；","公钥与密文均为单个环元素，128 位经典安全下各约 670 字节，无压缩/LWR；","显式避免独立性假设，提供严格解密失败概率分析；","详细讨论侧信道对策，含 Pt2Noise、Noise2Pt、多项式求逆等模块的掩码方案。"],"level1":{"label":true,"pk":670,"sk":null,"sig":null,"ct":670,"source":"规范正文明确：pk 与 ct 均为单个环元素可存储于 670 字节（C1 参数，128-bit 级别）；AKE 总通信量 1127B/方（含双环元素）；sk_bytes 未在 Section 5 可读范围内给出 | 128 位参数摘录自规范（Table 2 (line 1089): NEV-R1 n=512 q=1409 (B3,B3) (B3,B3) PK=672 CT=672 DFR=2^{-133}; recommended 128-bit set; sk not lis）"},"spec_file":"kem_25_NEV.txt","spec_chars":48349,"text_available":true,"id":"kex-nev-ake","status":"第一轮候选","first_seen":"2026-09-20","cls":"格密码"},{"name":"NIIKE","catLabel":"密钥交换（KEX）","cat":"kex","family":"同源——理想类群作用（Ideal Class Group Action on Oriented Elliptic Curves）","assumption":"在定向椭圆曲线上求解理想类群作用的困难性（类 CSIDH 假设，但底层构造源自 2025 年新引入的类群作用，特征更小）。","summary":"NIIKE 是极为罕见的后量子非交互式密钥交换（NIKE）方案，基于 2025 年新提出的定向椭圆曲线理想类群作用。公钥分发完成后，任意一方仅凭自己的私钥和对方公钥即可独立、确定性地派生相同共享秘密，无需任何在线通信轮次。NIIKE 的关键特性：哑元（dummy-free）、恒定时间、确定性。底层类群作用以\"定向曲线加有理点集合\"表示带定向的椭圆曲线；私钥为理想类群中的元素向量，公钥为作用后的曲线。相比同类方案：与 Swoosh 相比，NIIKE 公钥大小大幅缩减（Swoosh 靶向约 120 位量子安全时需约 220 KB，NIIKE 远更紧凑）；与 CSIDH 相比，基域特征更小（CSIDH 靶向 128 位经典安全需 4096 位特征，NIIKE 在 128 位和 256 位经典安全下均更小），执行效率更高且适合并行优化。","points":["后量子 NIKE（非交互）——在 PQC 中极为罕见的性质，支持异步和离线通信场景；","基于 2025 年新提出的定向椭圆曲线理想类群作用（dummy-free、确定性、恒定时间）；","靶向 128 位和 256 位经典安全级别，公钥尺寸较 Swoosh 大幅压缩；","基域特征小于 CSIDH（128/256 位经典安全），理论和实现均已优化；","实现采用并行优化策略，具备进一步优化潜力。"],"level1":{"pk":4030,"sk":196,"label":"NGCC-I","source":"128 位参数摘录自规范（Table 7.1 (line 1690): NGCC-I Private key=196B Current Impl Public key=4030B Shared secret=62B; NIKE so no ciphertext）"},"spec_file":"kex_08_NIIKE.txt","spec_chars":36319,"text_available":true,"id":"kex-niike","status":"第一轮候选","first_seen":"2026-09-20","cls":"同源类"},{"name":"TriQ-KEX","catLabel":"密钥交换（KEX）","cat":"kex","family":"编码——准循环 MDPC 码（Quasi-Cyclic MDPC，TriQ-KEM 族）","assumption":"准循环低密度奇偶检查（QC-MDPC）码的解码困难性（TriQ-KEM 的底层假设），以及 FSXY 变换所需的 PRF/KDF 假设与最小熵条件。","summary":"TriQ-KEX 是通过 FSXY 通用变换将 TriQ-KEM 实例化为两消息 AKE 的后量子编码基密钥交换协议，是当前 NICCS 征集中为数不多的代码基 KEX 提案，为密码多样性提供非格基选项。TriQ-KEX 使用 TriQ-KEM（IND-CCA2 安全，作为静态 KEM）和 TriQ-wKEM（IND-CPA 安全，作为临时 KEM），保留与 TriQ-KEM 相同的密钥、密文和共享秘密格式。在 FSXY 假设下，TriQ-KEX 在标准模型中实现 CK+ 安全性，安全归约依赖组件 KEM 的安全性及 PRF/KDF 假设。规范提供完整参数集及密钥、消息、会话密钥尺寸，以及 CK+ 安全性的 FSXY 归约分析、具体安全估计、实现性能记录及已知答案测试（KAT）。与 HQC（代码基 KEM NIST 标准）相比，TriQ-KEX 基于不同的准循环码族，侧重 AKE 协议层设计。","points":["代码基（准循环 MDPC）AKE，提供与格基方案不同的密码学多样性；","FSXY 通用变换，使用 TriQ-KEM（静态，IND-CCA2）+ TriQ-wKEM（临时，IND-CPA）；","安全模型为标准模型下 CK+，归约依赖组件 KEM 安全性及 PRF/KDF 假设；","提供完整 KAT（已知答案测试）和实现性能数据；","包含知识产权声明（Intellectual Property Notice）。"],"level1":{"pk":2054,"sk":2134,"ct":4086,"label":"TriQ-KEX-128","source":"128 位参数摘录自规范（Table 3 (line 497): TriQ-KEX-128 |pkiKEX|=2054 |skiKEX|=2134; Table 2 (line 489): |cKEM|=4086; all in bytes）"},"spec_file":"kex_09_TriQ-KEX.txt","spec_chars":2624,"text_available":false,"id":"kex-triq-kex","status":"第一轮候选","first_seen":"2026-09-20","cls":"编码类"}]};
